<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hinagata — hand-drawn look</title>
<style>
html, body { margin: 0; height: 100%; background: #f1ece1; font: 13px/1.4 system-ui, sans-serif; color: #3b332e; }
canvas { display: block; width: 100%; height: 100%; }
#ui { position: fixed; left: 10px; top: 10px; background: #fffa; padding: 8px 10px; border-radius: 8px; display: grid; grid-template-columns: auto 110px; gap: 2px 8px; align-items: center; }
#ui label.wide { grid-column: 1 / 3; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><label class="wide"><input type="checkbox" id="on" checked> hand-drawn</label></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { createAvatar } from "../src/index.js";
import { createSketch } from "./sketch.js";

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true, stencil: true, preserveDrawingBuffer: true });
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(); scene.background = new THREE.Color("#f1ece1");
const camera = new THREE.PerspectiveCamera(24, 1, 0.1, 30); camera.position.set(0.5, 1.45, 2.3);
const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(0, 1.32, 0); controls.update();
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8c8b8, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(1.5, 3, 2.2); scene.add(sun);

const sketch = createSketch(renderer);
const resize = () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); sketch.setSize(); };
addEventListener("resize", resize); resize();

// the knobs: every one is a uniform of the pass
const ui = document.getElementById("ui"), on = document.getElementById("on");
for (const [k, max] of [["line", 1], ["lineWidth", 3], ["wobble", 6], ["wash", 1], ["bleed", 1], ["hatch", 1], ["grain", 1], ["fade", 1]]) {
  const l = document.createElement("span"); l.textContent = k;
  const r = Object.assign(document.createElement("input"), { type: "range", min: 0, max, step: 0.01, value: sketch.uniforms[k].value });
  r.oninput = () => { sketch.uniforms[k].value = +r.value; }; ui.append(l, r);
}

const q = new URLSearchParams(location.search);
const avatar = await createAvatar({ hair: { back: "bob", bangsForm: "block" }, outfit: { shirt: { color: "#8cc084" } } });
avatar.update(0, { instant: true });
avatar.object.scale.setScalar(1.7 / new THREE.Box3().setFromObject(avatar.object).getSize(new THREE.Vector3()).y);
scene.add(avatar.object);
if (q.get("play")) avatar.play(q.get("play"));   // ?play=walk
if (q.get("on") === "0") on.checked = false;

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => { avatar.update(clock.getDelta(), { camera }); controls.update();
  if (on.checked) sketch.render(scene, camera); else renderer.render(scene, camera); window.READY = true; });
</script>
</body>
</html>
