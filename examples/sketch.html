<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hinagata — 手描き風</title>
<style>
html, body { margin: 0; height: 100%; background: #fbfaf6; font: 13px sans-serif; } canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#ui { position: fixed; left: 8px; bottom: 8px; display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 6px 10px; background: #fffc; border-radius: 8px; }
#ui label { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <label>ゆらぎ <input id="wobble" type="range" min="0" max="3" step="0.1" value="1"></label>
  <label>線の太さ <input id="width" type="range" min="0.6" max="2.5" step="0.1" value="1"></label>
  <label><input id="tone" type="checkbox" checked> 影トーン</label>
  <label><input id="keep" type="checkbox"> 色を残す</label>
  <label><input id="boil" type="checkbox"> 線を揺らす</label>
  <label><input id="move" type="checkbox"> 歩く</label>
</div>
<script type="module">
// 手描き風の試作: 色・法線と奥行き・物の番号を別々に描き、後段で境目を拾ってペンの線にする(?who=sylvie で初代)。
// 外形(番号と奥行きの境目)は太く、中の折れ目と柄は細く。線を取る位置をなめらかなノイズでずらして、定規なしの線にする。
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { createAvatar, CHARACTERS } from "../src/index.js";

const Q = new URLSearchParams(location.search), $ = (id) => document.getElementById(id);
const renderer = new THREE.WebGLRenderer({ canvas: $("c"), antialias: false, preserveDrawingBuffer: true });
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.5, 20); camera.position.set(1.1, 1.25, 4.2);
const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(0, 0.92, 0); controls.update();
scene.add(new THREE.AmbientLight(0xffffff, 3));

// 色の面は陰なし(flat)で描く: トゥーンの陰の境目まで線に拾わないため。輪郭線の殻も切る(線は後段が引く)
const file = structuredClone(CHARACTERS[Q.get("who") ?? "sylvie2"].file);
file.options.shading = { ...file.options.shading, style: "flat" }; file.options.outline = { ...file.options.outline, on: false };
const avatar = await createAvatar(file);
avatar.update(0, { instant: true });
avatar.object.scale.setScalar(1.7 / new THREE.Box3().setFromObject(avatar.object).getSize(new THREE.Vector3()).y);
scene.add(avatar.object); window.avatar = avatar;

const colorRT = new THREE.WebGLRenderTarget(1, 1, { samples: 4 });
const near = { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter };
const normalRT = new THREE.WebGLRenderTarget(1, 1, { ...near, depthTexture: new THREE.DepthTexture(1, 1) }), idRT = new THREE.WebGLRenderTarget(1, 1, near);
const normalMat = new THREE.MeshNormalMaterial();
// 物の番号: メッシュごとに1色。髪は房ごとに線を出さないよう1つにまとめる。顔の絵(目・眉)は面ではないので番号と法線の絵から外す
const HAIR = ["hair", "locks", "bangs", "tails", "drawn"], ids = [], flats = [], idOf = new Map();
avatar.object.traverse((m) => { if (!m.isMesh || m.userData.outline) return;
  if (m.material.transparent) { flats.push(m); return; }
  const key = Object.entries(avatar.parts).find(([, x]) => x?.m === m)?.[0], group = HAIR.includes(key) ? "hair" : m.uuid;
  if (!idOf.has(group)) { const n = idOf.size + 1; idOf.set(group, new THREE.MeshBasicMaterial({ color: new THREE.Color(((n * 37) % 255) / 255, ((n * 101) % 255) / 255, ((n * 173) % 255) / 255) })); }
  ids.push([m, idOf.get(group)]); });

const post = new THREE.ShaderMaterial({
  uniforms: { tColor: { value: colorRT.texture }, tNormal: { value: normalRT.texture }, tDepth: { value: normalRT.depthTexture }, tId: { value: idRT.texture }, res: { value: new THREE.Vector2() },
    near: { value: camera.near }, far: { value: camera.far }, seed: { value: 0 }, wobble: { value: 1 }, lineW: { value: 1 }, tone: { value: 1 }, keep: { value: 0 },
    light: { value: new THREE.Vector3(-0.55, 0.6, 0.58).normalize() } },   // 視点空間の光(左上手前から)
  vertexShader: "varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }",
  fragmentShader: `
    varying vec2 vUv; uniform sampler2D tColor, tNormal, tDepth, tId; uniform vec2 res; uniform float near, far, seed, wobble, lineW, tone, keep; uniform vec3 light;
    float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
    float vn(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }
    // 手のぶれ: ゆっくりしたうねりだけ(細かい震えを足すと線がギザつく)。単位 px、-1..1
    vec2 warp(vec2 p, float s) { return vec2(vn(p / 60.0 + s) + 0.5 * vn(p / 23.0 + s * 1.7), vn(p / 60.0 + s + 31.7) + 0.5 * vn(p / 23.0 + s * 1.7 + 9.2)) / 0.75 - 1.0; }
    float lin(vec2 uv) { float z = texture2D(tDepth, uv).x * 2.0 - 1.0; return 2.0 * near * far / (far + near - z * (far - near)); }
    vec3 nrm(vec2 uv) { vec4 t = texture2D(tNormal, uv); return t.a < 0.5 ? vec3(0.0) : t.xyz * 2.0 - 1.0; }
    // 外形の線: 物の番号が変わる所と、奥行きの段差
    float outer(vec2 uv, float w) { vec2 d = w / res; vec2 a = uv - d, b = uv + d, c = uv + vec2(-d.x, d.y), e = uv + vec2(d.x, -d.y);
      float di = step(0.002, length(texture2D(tId, a) - texture2D(tId, b)) + length(texture2D(tId, c) - texture2D(tId, e)));
      float za = lin(a), zb = lin(b), zc = lin(c), ze = lin(e);
      // 視線に寝た面は隣との奥行きの差が大きい: そこを段差と見なさないよう、面の向きで閾値を上げる
      float dz = (abs(za - zb) + abs(zc - ze)) / min(min(za, zb), min(zc, ze)) * clamp(nrm(uv).z, 0.12, 1.0);
      return max(di, smoothstep(0.005, 0.008, dz)); }
    // 中の線: x = 折れ目(法線の向きの差)、y = 柄や白目の境(色の差)
    vec2 inner(vec2 uv, float w) { vec2 d = w / res; vec2 a = uv - d, b = uv + d, c = uv + vec2(-d.x, d.y), e = uv + vec2(d.x, -d.y);
      float dn = length(nrm(a) - nrm(b)) + length(nrm(c) - nrm(e));
      float dc = length(texture2D(tColor, a).rgb - texture2D(tColor, b).rgb) + length(texture2D(tColor, c).rgb - texture2D(tColor, e).rgb);
      return vec2(smoothstep(1.0, 1.3, dn), smoothstep(0.16, 0.26, dc)); }
    float inkAt(vec2 px, float k) { vec2 uv = (px + warp(px, seed) * 3.0 * wobble * k) / res;
      float sw = lineW * k * (0.7 + 0.6 * vn(px / 130.0 + seed * 3.1));   // 線の太りと細り
      vec2 n = inner(uv, sw * 0.5); float skip = smoothstep(0.25, 0.4, vn(px / 45.0 + seed * 5.3));   // 折れ目の線は所々で抜く
      float dark = step(0.5, texture2D(tNormal, uv).a) * smoothstep(0.2, 0.12, dot(texture2D(tColor, uv).rgb, vec3(0.3, 0.6, 0.1)));   // 元から黒い所(瞳・まつ毛)はベタ
      return max(max(outer(uv, sw), dark), max(n.x * skip, n.y * 0.85)); }
    void main() { vec2 px = vUv * res; float k = res.y / 1000.0;
      float ink = 0.25 * (inkAt(px + vec2(0.125, 0.375), k) + inkAt(px + vec2(-0.375, 0.125), k) + inkAt(px + vec2(0.375, -0.125), k) + inkAt(px + vec2(-0.125, -0.375), k));
      vec2 uv = (px + warp(px, seed + 4.0) * 2.0 * wobble * k) / res;
      vec3 col = pow(texture2D(tColor, uv).rgb, vec3(0.4545)); float on = step(0.5, texture2D(tNormal, uv).a), lum = dot(col, vec3(0.3, 0.6, 0.1));
      vec3 paper = vec3(0.99, 0.985, 0.97);
      // トーンの段: 光の当たらない側で1段、色の暗さで1〜2段
      float level = on * tone * (smoothstep(0.2, 0.14, dot(nrm(uv), light)) + (1.0 - keep) * (step(lum, 0.72) + step(lum, 0.45)));
      vec3 base = mix(paper, mix(paper, col, 0.7), keep * on) * (1.0 - 0.115 * level);
      gl_FragColor = vec4(mix(base, vec3(0.13, 0.12, 0.15), clamp(ink, 0.0, 1.0)), 1.0); }`,
  depthTest: false, depthWrite: false });
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post), quadScene = new THREE.Scene(), quadCam = new THREE.Camera(); quad.frustumCulled = false; quadScene.add(quad);

const resize = () => { const dpr = Math.min(devicePixelRatio, 2), w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
  renderer.setPixelRatio(dpr); renderer.setSize(innerWidth, innerHeight, false); colorRT.setSize(w, h); normalRT.setSize(w, h); idRT.setSize(w, h); post.uniforms.res.value.set(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix(); };
addEventListener("resize", resize); resize();

const U = post.uniforms;
$("wobble").oninput = (e) => { U.wobble.value = +e.target.value; }; $("width").oninput = (e) => { U.lineW.value = +e.target.value; };
$("tone").onchange = (e) => { U.tone.value = +e.target.checked; }; $("keep").onchange = (e) => { U.keep.value = +e.target.checked; };
$("move").onchange = (e) => { e.target.checked ? avatar.play("walk") : avatar.stop?.(); };
for (const [k, v] of Q) { const el = $(k); if (!el) continue; if (el.type === "checkbox") el.checked = v !== "0"; else el.value = v; el.dispatchEvent(new Event(el.type === "checkbox" ? "change" : "input")); }

const clock = new THREE.Clock(); let t = 0;
renderer.setAnimationLoop(() => { const dt = clock.getDelta(); t += dt; avatar.update(dt, { camera });
  if ($("boil").checked) U.seed.value = Math.floor(t * 8);   // 1秒に8枚ぶん描き直した線
  renderer.setRenderTarget(colorRT); renderer.setClearColor(0xffffff, 1); renderer.render(scene, camera);
  for (const m of flats) m.visible = false;
  scene.overrideMaterial = normalMat; renderer.setRenderTarget(normalRT); renderer.setClearColor(0x000000, 0); renderer.render(scene, camera); scene.overrideMaterial = null;
  for (const x of ids) { x[2] = x[0].material; x[0].material = x[1]; } renderer.setRenderTarget(idRT); renderer.render(scene, camera); for (const x of ids) x[0].material = x[2];
  for (const m of flats) m.visible = true;
  renderer.setRenderTarget(null); renderer.render(quadScene, quadCam); window.READY = true; });
</script>
</body>
</html>
