<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hinagata — minimal example</title>
<style>html, body { margin: 0; height: 100%; background: #f0ece4; } canvas { display: block; width: 100%; height: 100%; }</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from "three";
import { createAvatar, BODY_TYPES } from "../src/index.js";

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color("#f0ece4");
const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 50); camera.position.set(1.7, 1.3, 3.6); camera.lookAt(0, 0.9, 0);   // a world in metres
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8c8b8, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(1.5, 3, 2.2); scene.add(sun);
const resize = () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); };
addEventListener("resize", resize); resize();

// one avatar: bob hair, green shirt, walking. The body: the default is the tall standard (about 5 heads);
// for a chibi game merge a chibi type: createAvatar({ ...BODY_TYPES.standard, hair: … })
const avatar = await createAvatar({ hair: { back: "bob", bangs: "block" }, outfit: { shirt: { color: "#8cc084" } } });
// the world is built in metres: size the character to it (an adult about 1.7 m), not the world to the character
avatar.update(0, { instant: true });
avatar.object.scale.setScalar(1.7 / new THREE.Box3().setFromObject(avatar.object).getSize(new THREE.Vector3()).y);
scene.add(avatar.object);
avatar.play("walk");

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => { avatar.update(clock.getDelta(), { camera }); renderer.render(scene, camera); });
</script>
</body>
</html>
