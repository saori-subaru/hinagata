<!--
  🧸新しいアバターの「素体」の試作。ピーロの体を使わず、ぜんぶコードで作る。
  ・寸法は見本の三面図(img/sotai-ref.jpg)から測った: 身長519px=1.4、約2.4頭身、首はほぼ無し、なで肩、ぽっこりおなか、短くて太い脚、指を開いた手
  ・体の形: 丸い形(楕円体と、太さの変わるカプセル)を置いて、なめらかに溶け合わせた1枚の肌にする(符号つき距離 → サーフェスネッツで網目)
  ・骨: 17本(腰・背骨・胸・首・頭 / 左右の 上腕・前腕・手 / 左右の 太もも・すね・足)。重みは「どの部品にいちばん近いか」から自動
  ・服と髪: 体を少しふくらませて、いらない所を切り取って作る → 体型が変わっても自動で合い、同じ骨で動く
  ・「三面図」: 見本と同じ縮尺・同じ位置で正面/横/後ろを描き、見本の画像を重ねて比べられる(URLに ?cmp でも開く)
  ・「glTFを書き出す」で .glb を保存(Blender でそのまま開ける)
-->

<style>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { createAvatar, POSES, SHADINGS, EXPRESSIONS, PART_LABELS } from "./src/index.js";
import { clayMat, toon } from "./src/materials.js";
import { fromQuery, merge } from "./src/options.js";
import { BODY_TYPES } from "./src/body/types.js";

// 素体の確認ページ: createAvatar で作ったキャラを、ボタンで着せ替え・ポーズ・見本との比較をして確かめる
const $ = (id) => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const low = matchMedia("(pointer: coarse)").matches || innerWidth < 820;

// ── 見た目(カメラ・ライト・床) ──
const canvas = $("gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, low ? 1.5 : 2)); renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color("#f0ece4");
const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 50); camera.position.set(0.9, 0.95, 3.0);
const controls = new OrbitControls(camera, canvas); controls.target.set(0, 0.62, 0); controls.enableDamping = true; controls.minDistance = 0.7; controls.maxDistance = 6; controls.maxPolarAngle = Math.PI * 0.55;
const hemi = new THREE.HemisphereLight(0xffffff, 0xd8c8b8, 1.6); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(1.5, 3, 2.2); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -1.2, right: 1.2, top: 1.8, bottom: -0.4, near: 0.5, far: 8 }); sun.shadow.bias = -0.0008; scene.add(sun);
const floor = new THREE.Mesh(new THREE.CircleGeometry(1.6, 48), new THREE.MeshToonMaterial({ color: 0xe2d8c8 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
function size() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w / h < 0.8 ? 44 : 32; camera.updateProjectionMatrix(); }
addEventListener("resize", size); size();
// 小道具(いす: 座面の上が 0.2)
const chair = new THREE.Group(); { const wood = toon(0xc49a6c); const seat = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.04, 0.26), wood); seat.position.set(0, 0.18, -0.03); chair.add(seat); const back = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.36, 0.035), wood); back.position.set(0, 0.36, -0.16); chair.add(back); for (const [x, z] of [[-0.17, 0.08], [0.17, 0.08], [-0.17, -0.14], [0.17, -0.14]]) { const l = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.18, 0.035), wood); l.position.set(x, 0.09, z); chair.add(l); } chair.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); chair.visible = false; scene.add(chair); }

// ── 素体を作る ──
const WRAP = { zc: -0.02, r: 0.24 };   // 顔の絵の貼り方: 頭のまわりに巻きつける(?wrap)
let avatar, parts, I, face, helper = null, curPose = "aPose";
let onAvatar = null;   // キャラを作り直したあとに呼ぶ(前髪の玉を置き直す)
const BANG = { tips: null, thick: null };   // 前髪のふさ・厚さを動かした結果(作り直しても引き継ぐ)。null = いじっていない
const LOOK = { shade: "toon", line: true, cheeks: false, nose: false, blush: null };   // 塗り方・輪郭線・赤み(作り直しても引き継ぐ。blush: 選んだ赤みの色)
const keepStyle = (av) => { if (LOOK.shade !== "toon") av.setShading(LOOK.shade); if (!LOOK.line) av.setOutline({ on: false }); if (LOOK.cheeks || LOOK.nose || LOOK.blush) av.setBlush({ cheeks: { on: LOOK.cheeks, ...(LOOK.blush ? { color: LOOK.blush } : {}) }, nose: { on: LOOK.nose, ...(LOOK.blush ? { color: LOOK.blush } : {}) } }); };
async function makeAvatar(opts, quiet = false) {   // 作る(作り直すときは古いのを捨てる)。quiet: 画面を隠さず、上に小さく「作り直し中」
  $(quiet ? "busy" : "msg").hidden = false; await new Promise((r) => requestAnimationFrame(() => r()));
  if (avatar) avatar.dispose();
  const t0 = performance.now();
  avatar = await createAvatar(opts, { quality: low ? "low" : "high", workers: !Q.has("noworkers"), debug: { slow: Q.has("slow"), oldSock: Q.has("oldsock"), faceWrap: Q.has("wrap") ? WRAP : null } });
  scene.add(avatar.object); keepStyle(avatar);
  ({ parts, internals: I } = avatar); face = I.face;
  globalThis.sotai = { avatar, bodySdf: I.bodySdf, bodySdfSlow: I.bodySdfSlow, P: I.P, CUT: I.CUT, PROF: avatar.PROF, OPT: avatar.options };   // 確認用
  const nv = Object.values(parts).reduce((s, x) => s + x.m.geometry.attributes.position.count, 0);
  $("stat").textContent = `頂点 ${nv.toLocaleString()} / 骨 ${I.BONES.length} / 生成 ${Math.round(performance.now() - t0)}ms`;
  if (helper) scene.remove(helper);
  helper = new THREE.SkeletonHelper(avatar.object); helper.visible = $("tBone").getAttribute("aria-pressed") === "true"; helper.material.depthTest = false; scene.add(helper);
  avatar.play(curPose);
  $("msg").hidden = $("busy").hidden = true;
  onAvatar?.();
}
await makeAvatar(fromQuery(location.search));
globalThis.sotaiChecksum = () => avatar.checksum();
globalThis.sotaiSetCam = (v) => { camera.position.set(v[0], v[1], v[2]); if (v.length > 3) controls.target.set(v[3], v[4], v[5]); };   // 確認用: カメラを置く

// ── 表示の切りかえ(ねんど色・網目・見本と比べる) ──
const SKINS = ["#ffe0c8", "#f6d0b0", "#e8c8a8", "#c89a78", "#8a5f45"]; let skinI = 0;
const cmpMat = new THREE.MeshBasicMaterial({ color: 0x6fa8ff });   // 三面図で見本と重ねるときは、べた塗りの青(ずれが見分けやすい)
let clay = false, wire = false, compare = false, twin = null;   // twin: 横に並べる案2
const ARMOR = ["armorChest", "armorShoulders", "armorArms", "armorLegs", "armorHelm", "armorVisor", "armorDeco", "armorHands", "armorFeet", "armorMail"];   // 鎧の部品(後ろの6つは全身鎧だけ)
const WEAPONS = ["weaponR", "weaponRGrip", "weaponL", "weaponLFace", "weaponLGrip"];   // 手に持つもの
const all = () => [parts.body, parts.shirt, parts.pants, parts.socks, parts.shoes, parts.soles, parts.hair, ...ARMOR.map((k) => parts[k]), ...WEAPONS.map((k) => parts[k])];
function refreshLook() {
  for (const av of [avatar, twin].filter(Boolean)) {
    const P = av.parts, body = P.body;
    body.toonMat.color.set(SKINS[skinI]); body.m.material = compare && $("tRef").getAttribute("aria-pressed") === "true" ? cmpMat : clay ? clayMat : body.toonMat;
