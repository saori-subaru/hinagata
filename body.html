<!--
  🧸新しいアバターの「素体」の試作。ピーロの体を使わず、ぜんぶコードで作る。
  ・寸法は見本の三面図(img/sotai-ref.jpg)から測った: 身長519px=1.4、約2.4頭身、首はほぼ無し、なで肩、ぽっこりおなか、短くて太い脚、指を開いた手
  ・体の形: 丸い形(楕円体と、太さの変わるカプセル)を置いて、なめらかに溶け合わせた1枚の肌にする(符号つき距離 → サーフェスネッツで網目)
  ・骨: 17本(腰・背骨・胸・首・頭 / 左右の 上腕・前腕・手 / 左右の 太もも・すね・足)。重みは「どの部品にいちばん近いか」から自動
  ・服と髪: 体を少しふくらませて、いらない所を切り取って作る → 体型が変わっても自動で合い、同じ骨で動く
  ・「三面図」: 見本と同じ縮尺・同じ位置で正面/横/後ろを描き、見本の画像を重ねて比べられる(URLに ?cmp でも開く)
  ・「glTFを書き出す」で .glb を保存(Blender でそのまま開ける)
-->
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<style>
:root { --ink: #2b2230; --muted: #7a6f80; --bg: #f0ece4; --round: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', system-ui, sans-serif; --mono: 'Martian Mono', ui-monospace, monospace; }

.top { position: fixed; left: 12px; right: 12px; top: calc(10px + env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; z-index: 2; }

.btn { font: inherit; font-size: 12px; font-weight: 800; color: var(--ink); background: #ffffffd8; border: 2px solid #00000014; border-radius: 99px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.btn[aria-pressed="true"] { background: var(--ink); color: #fff; }
@media (max-width: 720px) { body.chgOpen .side > :not(#tChg):not(.pick):not(#tPair) { display: none; } }   /* 狭い画面: 変更パネル中は右の顔がボタンに隠れないように */
.chg { display: grid; gap: 3px; } .chg label { display: flex; gap: 6px; align-items: center; font-size: 12px; } .chg input { width: 16px; height: 16px; }
.pick { display: inline-flex; gap: 6px; align-items: center; } .pick select { font: inherit; font-size: 12px; font-weight: 800; color: var(--ink); background: transparent; border: 0; max-width: 150px; cursor: pointer; }
.poses { position: fixed; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 0 10px; z-index: 2; }
.poses .btn { font-size: 14px; padding: 9px 16px; box-shadow: 0 3px 0 #0000001a; }

.lay b { font-size: 12px; } .types { display: flex; flex-wrap: wrap; gap: 4px; } .types .btn { padding: 4px 10px; font-size: 11px; } .lay .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 6px; align-items: center; } .lay .row input { grid-column: 1 / -1; width: 100%; }
.lay .val { font: 500 10px var(--mono); color: var(--muted); } .lay textarea { width: 100%; font: 500 10px var(--mono); resize: none; border-radius: 8px; border: 1px solid #0002; padding: 4px; }
@media (max-width: 720px) {   /* 狭い画面: 顔が隠れないように下に寄せて、スライダーは2列 */
  .lay { top: auto; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); width: auto; max-height: 46vh; padding: 8px 10px; gap: 4px; }
  #laySliders, #limbSliders { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; }
  .lay textarea { height: 2.6em; }
}

<body>
<canvas id="gl"></canvas>
<img id="ref" src="img/sotai-ref.jpg" alt="" hidden>
<div class="top">
  <div><h1>素体(試作)</h1><small>約2.4頭身 / 骨18本 / ぜんぶコードで生成</small><a href="../lab/town.html">← ホーム</a></div>
  <div class="side">

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { createAvatar, POSES } from "./src/index.js";
import { clayMat, toon } from "./src/materials.js";
import { fromQuery, merge } from "./src/options.js";
import { BODY_TYPES } from "./src/body/types.js";

// 素体の確認ページ: createAvatar で作ったキャラを、ボタンで着せ替え・ポーズ・見本との比較をして確かめる
const $ = (id) => document.getElementById(id);
const Q = new URLSearchParams(location.search);
const low = matchMedia("(pointer: coarse)").matches || innerWidth < 820;

// ── 見た目(カメラ・ライト・床) ──
const canvas = $("gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, low ? 1.5 : 2)); renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color("#f0ece4");
const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 50); camera.position.set(0.9, 0.95, 3.0);
const controls = new OrbitControls(camera, canvas); controls.target.set(0, 0.62, 0); controls.enableDamping = true; controls.minDistance = 0.7; controls.maxDistance = 6; controls.maxPolarAngle = Math.PI * 0.55;
const hemi = new THREE.HemisphereLight(0xffffff, 0xd8c8b8, 1.6); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(1.5, 3, 2.2); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -1.2, right: 1.2, top: 1.8, bottom: -0.4, near: 0.5, far: 8 }); sun.shadow.bias = -0.0008; scene.add(sun);
const floor = new THREE.Mesh(new THREE.CircleGeometry(1.6, 48), new THREE.MeshToonMaterial({ color: 0xe2d8c8 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
function size() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w / h < 0.8 ? 44 : 32; camera.updateProjectionMatrix(); }
addEventListener("resize", size); size();
// 小道具(いす: 座面の上が 0.2)
const chair = new THREE.Group(); { const wood = toon(0xc49a6c); const seat = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.04, 0.26), wood); seat.position.set(0, 0.18, -0.03); chair.add(seat); const back = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.36, 0.035), wood); back.position.set(0, 0.36, -0.16); chair.add(back); for (const [x, z] of [[-0.17, 0.08], [0.17, 0.08], [-0.17, -0.14], [0.17, -0.14]]) { const l = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.18, 0.035), wood); l.position.set(x, 0.09, z); chair.add(l); } chair.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); chair.visible = false; scene.add(chair); }

// ── 素体を作る ──
const WRAP = { zc: -0.02, r: 0.24 };   // 顔の絵の貼り方: 頭のまわりに巻きつける(?wrap)
let avatar, parts, I, face, helper = null, curPose = "aPose";
async function makeAvatar(opts, quiet = false) {   // 作る(作り直すときは古いのを捨てる)。quiet: 画面を隠さず、上に小さく「作り直し中」
  $(quiet ? "busy" : "msg").hidden = false; await new Promise((r) => requestAnimationFrame(() => r()));
  if (avatar) avatar.dispose();
  const t0 = performance.now();
  avatar = await createAvatar(opts, { quality: low ? "low" : "high", debug: { slow: Q.has("slow"), oldSock: Q.has("oldsock"), faceWrap: Q.has("wrap") ? WRAP : null } });
  scene.add(avatar.object);
  ({ parts, internals: I } = avatar); face = I.face;
  globalThis.sotai = { avatar, bodySdf: I.bodySdf, bodySdfSlow: I.bodySdfSlow, P: I.P, CUT: I.CUT, PROF: avatar.PROF, OPT: avatar.options };   // 確認用
  const nv = Object.values(parts).reduce((s, x) => s + x.m.geometry.attributes.position.count, 0);
  $("stat").textContent = `頂点 ${nv.toLocaleString()} / 骨 ${I.BONES.length} / 生成 ${Math.round(performance.now() - t0)}ms`;
  if (helper) scene.remove(helper);
  helper = new THREE.SkeletonHelper(avatar.object); helper.visible = $("tBone").getAttribute("aria-pressed") === "true"; helper.material.depthTest = false; scene.add(helper);
  avatar.play(curPose);
  $("msg").hidden = $("busy").hidden = true;
}
await makeAvatar(fromQuery(location.search));
globalThis.sotaiChecksum = () => avatar.checksum();

// ── 表示の切りかえ(ねんど色・網目・見本と比べる) ──
const SKINS = ["#ffe0c8", "#f6d0b0", "#e8c8a8", "#c89a78", "#8a5f45"]; let skinI = 0;
const cmpMat = new THREE.MeshBasicMaterial({ color: 0x6fa8ff });   // 三面図で見本と重ねるときは、べた塗りの青(ずれが見分けやすい)
let clay = false, wire = false, compare = false, twin = null;   // twin: 横に並べる案2
const all = () => [parts.body, parts.shirt, parts.pants, parts.socks, parts.shoes, parts.soles, parts.hair];
function refreshLook() {
  for (const av of [avatar, twin].filter(Boolean)) {
    const P = av.parts, body = P.body;
    body.toonMat.color.set(SKINS[skinI]); body.m.material = compare && $("tRef").getAttribute("aria-pressed") === "true" ? cmpMat : clay ? clayMat : body.toonMat;
    if (av === twin) for (const k of ["shirt", "pants", "socks", "shoes", "soles", "hair"]) P[k].on = parts[k].on;   // 並べたほうも同じ着せ方
    for (const x of [P.body, P.shirt, P.pants, P.socks, P.shoes, P.soles, P.hair]) { x.m.visible = x === body || (x.on && !clay); x.m.material.wireframe = wire; x.o.visible = x.m.visible && !clay && !wire; }
    av.faceLayer.visible = !clay; if (av.earLine) av.earLine.visible = !clay && !wire;
  }
  floor.visible = !compare;
}

// ── 顔 ──
const FACES = Object.keys(face.PRESETS); let faceI = 0;
function faceLabels() { const s = avatar.faceSel; $("tFace").textContent = `表情: ${FACES[faceI]}`; $("tEyes").textContent = `目: ${s.eyes}`; $("tBrow").textContent = `眉: ${s.brows}`; $("tMouth").textContent = `口: ${s.mouth}`; }
// 顔全体を1枚に描いた絵(PNG)を貼る(古いやり方)。顔の絵と同じ座標(1024×768)で置く
//   置き方: 絵の基準点(ax, ay)を、下絵の(512 + x, 586 + y)に、大きさ s 倍で合わせる(基準点=鼻の点の左右・口の高さ)
const FACE_IMG = { on: false, img: null, ax: 445, ay: 596, x: 0, y: 200, s: 1 };
function whiteToAlpha(im) {   // 白い背景(ふちから続く真っ白)だけ透明にする。白目は少し灰色なので残る。もともと透明な絵はそのまま
  const W = im.width, H = im.height, c = document.createElement("canvas"); c.width = W; c.height = H; const g = c.getContext("2d"); g.drawImage(im, 0, 0);
  const d = g.getImageData(0, 0, W, H), D = d.data, A = new Uint8Array(W * H), q = [];
  const white = (i) => D[i * 4 + 3] > 0 && D[i * 4] > 250 && D[i * 4 + 1] > 250 && D[i * 4 + 2] > 250;
  for (let x = 0; x < W; x++) q.push(x, (H - 1) * W + x); for (let y = 0; y < H; y++) q.push(y * W, y * W + W - 1);
  while (q.length) { const i = q.pop(); if (A[i] || !white(i)) continue; A[i] = 1; const x = i % W; if (x > 0) q.push(i - 1); if (x < W - 1) q.push(i + 1); if (i >= W) q.push(i - W); if (i < W * (H - 1)) q.push(i + W); }
  for (let i = 0; i < W * H; i++) { if (A[i]) { D[i * 4 + 3] = 0; continue; }
    const x = i % W; if ((x > 0 && A[i - 1]) || (x < W - 1 && A[i + 1]) || (i >= W && A[i - W]) || (i < W * (H - 1) && A[i + W])) { const m = Math.min(D[i * 4], D[i * 4 + 1], D[i * 4 + 2]); if (m > 180) D[i * 4 + 3] = Math.round(255 * Math.min(1, (255 - m) / 75)); } }
  g.putImageData(d, 0, 0); return c;
}
const drawFaceImg = (f) => { if (!FACE_IMG.img) return false; const F = FACE_IMG, w = F.img.width * F.s, h = F.img.height * F.s;
  f.fctx.clearRect(0, 0, f.faceCanvas.width, f.faceCanvas.height); f.fctx.drawImage(F.img, 512 + F.x - F.ax * F.s, 586 + F.y - F.ay * F.s, w, h); f.faceTex.needsUpdate = true;
  $("fiVal").textContent = `上下 ${F.y} / 左右 ${F.x} / 大きさ ${F.s.toFixed(2)}`; return true; };
function loadFaceImg(src, anchor) { const im = new Image(); im.onload = () => { FACE_IMG.img = whiteToAlpha(im); if (anchor) Object.assign(FACE_IMG, anchor); else Object.assign(FACE_IMG, { ax: im.width / 2, ay: im.height * 0.95 }); avatar.drawFace(); }; im.src = src; }
loadFaceImg("img/face-test.png", { ax: 445, ay: 596 });

// 顔の下絵づくり用: 顔の絵と同じ座標(1024×768)で、正面からまっすぐ撮った頭の画像と、パーツの基準点を返す(facekit が使う)
globalThis.sotaiFaceSheet = (mode = "skin") => {
  const { FACE, faceCanvas, px, py, PART_IMG, EYE, BROW, MOUTHP } = face;
  const W = faceCanvas.width, Hc = faceCanvas.height, yc = (FACE.y0 + FACE.y1) / 2;
  const cam = new THREE.OrthographicCamera(FACE.x0, FACE.x1, FACE.y1 - yc, FACE.y0 - yc, 0.1, 10); cam.position.set(0, yc, 3); cam.lookAt(0, yc, 0);
  avatar.skeleton.pose(); for (const x of all()) { x.m.visible = x === parts.body; x.o.visible = x === parts.body && mode !== "clay"; } avatar.faceLayer.visible = false; floor.visible = false; helper.visible = false;
  parts.body.m.material = mode === "clay" ? clayMat : parts.body.toonMat;
  const pr = renderer.getPixelRatio(); renderer.setPixelRatio(1); renderer.setSize(W, Hc, false); renderer.render(scene, cam);
  const url = renderer.domElement.toDataURL("image/png");
  renderer.setPixelRatio(pr); size(); refreshLook();
  const at = (k, a) => [px(a.x + PART_IMG[k].dx), py(a.y + PART_IMG[k].dy)];   // パーツの絵の真ん中が来る点(絵のピクセル)
  return { url, size: [W, Hc], anchors: { eye: at("eye", EYE), brow: at("brow", BROW), mouth: at("mouth", MOUTHP) } };
};

// ── 三面図(見本の画像と同じ縮尺・同じ位置に、正面/横/後ろを描く) ──
const REF = { W: 1376, H: 768, floor: 732, hpx: 519, fx: [271, 699, 1128] };

  row.innerHTML = `<span>${label}</span><span class="val" id="tv-${k}"></span><input type="range" id="ts-${k}" min="${min}" max="${max}" step="${step}">`;
  $("limbSliders").append(row);
  $("ts-" + k).addEventListener("input", (e) => { SHAPE[g][k] = +e.target.value; limbSync(); });
  $("ts-" + k).addEventListener("change", rebuildBody);
}
$("limbReset").addEventListener("click", () => { Object.assign(SHAPE.torso, SHAPE0.torso); Object.assign(SHAPE.thickness, SHAPE0.thickness); limbSync(); rebuildBody(); });
// 狭い画面では、下のパネルに隠れないよう全身を上半分に出す
let limbCam = null;
// 変更を選ぶパネル: チェックしてから「反映」で1回だけ作り直す。開くと右に「幅を縮める前」を並べる
for (const [i, [name]] of CHANGES.entries()) { const l = document.createElement("label"); l.innerHTML = `<input type="checkbox"> ${name}`; l.firstChild.addEventListener("change", (e) => { CHG_ON[i] = e.target.checked; chgSync(); }); $("chgList").append(l); }
function chgSync() { [...$("chgList").querySelectorAll("input")].forEach((c, i) => { c.checked = CHG_ON[i]; });
  const on = CHANGES.filter((_, i) => CHG_ON[i]).map(([n]) => n); $("chgOut").value = on.length ? "足す: " + on.join(" / ") : "(なにも足さない = いまの標準)"; }
$("chgAll").addEventListener("click", () => { CHG_ON.fill(true); chgSync(); });
$("chgNone").addEventListener("click", () => { CHG_ON.fill(false); chgSync(); });
$("chgApply").addEventListener("click", () => rebuildBody());
toggle("tChg", async (on) => {
  for (const id of ["tLimb", "tLay"]) if (on && $(id).getAttribute("aria-pressed") === "true") $(id).click();
  $("chgPanel").hidden = !on; document.body.classList.toggle("chgOpen", on); chgSync();
  if (on && !twin) { pairI = HEAD_VARIANTS.findIndex(([n]) => n === "前髪なし"); $("tPair").click(); }
  if (on) { while (!twin) await new Promise((r) => setTimeout(r, 200));   // 並べ終わってから、2人の顔に寄る(狭い画面では下のパネルに隠れないよう上に)
    const narrow = innerWidth <= 720; camera.position.set(0, narrow ? 0.75 : 1.0, narrow ? 3.6 : 2.7); controls.target.set(0, narrow ? 0.62 : 0.92, 0); }
});
toggle("tLimb", (on) => {
  for (const id of ["tLay", "tChg"]) if (on && $(id).getAttribute("aria-pressed") === "true") $(id).click();
  $("limbPanel").hidden = !on; $("poses").hidden = on || compare; limbSync();
  if (on && innerWidth <= 720) { limbCam = [camera.position.clone(), controls.target.clone()]; const x = twin ? 0 : avatar.object.position.x; camera.position.set(x, 0.55, twin ? 6.2 : 5.2); controls.target.set(x, 0.0, 0); }
  else if (!on && limbCam) { camera.position.copy(limbCam[0]); controls.target.copy(limbCam[1]); limbCam = null; }
});
toggle("tLay", (on) => {
  if (on && $("tChg").getAttribute("aria-pressed") === "true") $("tChg").click();
  if (on && $("tLimb").getAttribute("aria-pressed") === "true") $("tLimb").click();
  $("layPanel").hidden = !on; $("poses").hidden = on || compare; laySync();
  if (on) { layCam = [camera.position.clone(), controls.target.clone()]; const x = twin ? 0 : avatar.object.position.x, low = innerWidth <= 720 ? 0.16 : 0;
    camera.position.set(x, 0.98 - low, (twin ? 2.4 : 1.75) * (low ? 1.25 : 1)); controls.target.set(x, 0.95 - low, 0); }
  else if (layCam) { camera.position.copy(layCam[0]); controls.target.copy(layCam[1]); layCam = null; }
});
faceLabels(); hairLabels(); refreshLook();

// ── 確認用: ?view=front&pose=歩く&t=0.25 など ──
if (/[?&]cmp/.test(location.search)) $("tCmp").click();
const HT = [0.35, 0.5, 0.01];
const VIEW = { front: [0, 0.95, 3.0], q: [1.3, 0.9, 2.6], side: [3.0, 0.9, 0.02], back: [-1.3, 1.0, -2.6], face: [0.45, 1.05, 1.35, 0, 1.0, 0], face2: [0.6, 1.12, 1.25, 0, 0.97, 0], above: [0.05, 2.1, 0.75, 0, 0.95, 0.05], side34: [0.9, 1.05, 0.75, 0, 0.95, 0.05], earR: [0.3, 1.0, 0.75, 0.27, 0.99, 0], arm: [0.25, 0.62, 0.9, 0.23, 0.6, 0], armd: [0.3, 0.4, 0.75, 0.25, 0.56, 0], sideR: [-2.3, 0.55, 0.02, 0, 0.42, 0], top: [0, 2.0, 0.5, 0, 1.0, 0.05], noseside2: [0.6, 0.9, 0.24, 0, 0.9, 0.24], noseside: [0.7, 0.93, 0.24, 0, 0.93, 0.24], ear: [0.75, 1.05, -0.35, 0.2, 1.0, -0.03], earf: [0.55, 1.02, 0.6, 0.2, 1.0, -0.03],
  nose: [0.32, 1.0, 0.75, 0, 0.96, 0.15], hf: [0, 1.05, 1.3, 0, 1.05, 0], h34: [-1.05, 1.08, 0.75, 0, 1.0, 0.03], np: [0.5, 0.94, 0.17, 0, 0.94, 0.17], ef: [0.17, 0.95, 0.55, 0.17, 0.95, 0], es: [0.75, 0.96, -0.01, 0.15, 0.96, -0.01], h34b: [-0.75, 1.0, 1.05, 0, 0.98, 0.05], hbt: [-0.5, 1.75, -0.9, 0, 1.1, 0], hft: [0.5, 1.75, 0.9, 0, 1.1, 0], hs: [1.3, 1.05, 0.02, 0, 1.05, 0], hb: [-0.75, 1.15, -1.1, 0, 1.05, 0], ha: [0, 2.0, 0.3, 0, 1.05, 0], hand: [0.62, 0.66, 0.42, ...HT], handf: [0.36, 0.5, 0.55, ...HT], hands: [0.75, 0.45, 0.02, ...HT] }[Q.get("view")];
if (VIEW) { camera.position.set(...VIEW.slice(0, 3)); if (VIEW.length > 3) controls.target.set(...VIEW.slice(3)); }
const qp = [...$("poses").children].find((x) => x.textContent === Q.get("pose")); if (qp) qp.click();

// ── 毎フレーム ──
let last = performance.now();
(function frame(now) { requestAnimationFrame(frame); const dt = Math.min(0.05, (now - last) / 1000); last = now;
  avatar.update(dt, { t: Q.has("t") ? +Q.get("t") : undefined, instant: compare, pose: compare ? "aPose" : undefined });   // ?t=0.25 のように時刻を止めて確認できる
  twin?.update(dt, { t: Q.has("t") ? +Q.get("t") : undefined, instant: compare, pose: compare ? "aPose" : undefined });
  chair.visible = !!avatar.lastPose.chair && !compare;
  if (compare) renderCompare(); else { controls.update(); renderer.render(scene, camera); } })(last);
</script>
</body>
</html>
