<!--
  🧸新しいアバターの「素体」の試作。ピーロの体を使わず、ぜんぶコードで作る。
  ・寸法は見本の三面図(img/sotai-ref.jpg)から測った: 身長519px=1.4、約2.4頭身、首はほぼ無し、なで肩、ぽっこりおなか、短くて太い脚、指を開いた手
  ・体の形: 丸い形(楕円体と、太さの変わるカプセル)を置いて、なめらかに溶け合わせた1枚の肌にする(符号つき距離 → サーフェスネッツで網目)
  ・骨: 17本(腰・背骨・胸・首・頭 / 左右の 上腕・前腕・手 / 左右の 太もも・すね・足)。重みは「どの部品にいちばん近いか」から自動
  ・服と髪: 体を少しふくらませて、いらない所を切り取って作る → 体型が変わっても自動で合い、同じ骨で動く
  ・「三面図」: 見本と同じ縮尺・同じ位置で正面/横/後ろを描き、見本の画像を重ねて比べられる(URLに ?cmp でも開く)
  ・「glTFを書き出す」で .glb を保存(Blender でそのまま開ける)
-->
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<style>

.top { position: fixed; left: 12px; right: 12px; top: calc(10px + env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; z-index: 2; }

.btn[aria-pressed="true"] { background: var(--ink); color: #fff; }

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = (id) => document.getElementById(id);
const low = matchMedia("(pointer: coarse)").matches || innerWidth < 820;

// ============================================================
//  形(符号つき距離)。身長 1.4、正面は +z、キャラの左手が +x
// ============================================================
import { smin, E, axes, cut, G, C, dPrim, blend, blendFast, plane, sstep } from "./src/sdf/prim.js";   // 形の部品・溶け合わせ
import { grad, grad4, surfaceNets, gridSampler } from "./src/sdf/mesh.js";   // 網目にする
import { ramp, toon, outlineMat, CLAY, clayMat } from "./src/materials.js";   // アニメ塗り・輪郭線・ねんど色
import { resolveOptions, fromQuery } from "./src/options.js";   // 設定(初期値はいまのキャラ)
const OPT = resolveOptions(fromQuery(location.search));   // ?o=<JSON> や、調整用の短い名前(?nz=0.27 など)でも変えられる

const WRAP = { zc: -0.02, r: 0.24 }; let FACE_WRAP = /[?&]wrap/.test(location.search) ? WRAP : null;   // 顔の絵の貼り方: null=正面からまっすぐ / { zc, r }=頭のまわりに巻きつける
import { buildBody } from "./src/body/index.js";   // 体(関節と部品)
const { J, PARENT, BONES, BI, P, CUT, BODY, HEAD, CROTCH, EAR, FACE_DY, bodySdf, bodySdfSlow } = buildBody(OPT, { slow: new URLSearchParams(location.search).has("slow"), oldSock: /[?&]oldsock/.test(location.search) });
const PROF = [];   // 確認用: 部品ごとの生成時間と頂点数
globalThis.sotai = { bodySdf, bodySdfSlow, P, CUT, blend, PROF, OPT };   // 確認用
import { buildClothes } from "./src/clothes/index.js";   // 服・靴・靴下
const { pantsSdf, shirtSdf, shoeSdf, sockSdf, soleSdf } = buildClothes(OPT, { P, CROTCH, bodySdf });
const FAST = { shirt: (x, y, z) => shirtSdf(x, y, z, bodyAt), pants: (x, y, z) => pantsSdf(x, y, z, bodyAt), sock: (x, y, z) => sockSdf(x, y, z, bodyAt) };   // 格子で測るとき用
import { buildHair } from "./src/hair/index.js";   // 髪(前髪・後ろ髪・アホ毛)
import { makeSkeleton, makeWeights } from "./src/rig.js";   // 骨と重み
const weightsAt = makeWeights({ BODY, BONES, BI });
const { BANGS, BACKS, hairSdfOf: hairOf } = buildHair(OPT, { P, bodySdf });
const HAIR_PICK = { bangs: OPT.hair.bangs, back: OPT.hair.back, ahoge: OPT.hair.ahoge };   // いま選んでいる髪型
const hairSdfOf = () => hairOf(HAIR_PICK);
let hairSdf = hairSdfOf();


// ============================================================
//  網目にする(サーフェスネッツ)
// ============================================================
const PROJ = OPT.quality.project;   // 表面へ寄せる回数
const BAND = OPT.quality.band;   // 粗い格子で表面からこれだけ(×網目)離れていたら、細かく測らない
// 体の距離は一度だけ測って取っておき、服を作るときは格子から読む(体の計算をやり直さない)
let bodyAt = (x, y, z) => bodySdf(x, y, z);
function mesh(sdf, lo, hi, h, bone1, only, fast = sdf) {   // fast: 格子で測るときに使う速い版(なければ sdf)   // bone1: 指定すると全部その骨だけに付ける(髪は頭の骨) / only: 重みを付けてよい骨(正規表現)
  const T0 = performance.now(), { pos, nor, idx, grid, time } = surfaceNets(sdf, lo, hi, h, { fast, band: BAND, proj: PROJ });
  mesh.last = grid;   // 体の格子は服が使い回す
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute("normal", new THREE.BufferAttribute(nor, 3)); g.setIndex(idx);
  const w0 = performance.now();
  const nv = pos.length / 3, si = new Uint16Array(nv * 4), sw = new Float32Array(nv * 4), tmp = { idx: [0, 0, 0, 0], w: [0, 0, 0, 0] };
  for (let v = 0; v < nv; v++) { tmp.idx.fill(0); tmp.w.fill(0); if (bone1) { tmp.idx[0] = BI[bone1]; tmp.w[0] = 1; } else weightsAt(pos[v * 3], pos[v * 3 + 1], pos[v * 3 + 2], tmp, only);
    for (let q = 0; q < 4; q++) { si[v * 4 + q] = tmp.idx[q]; sw[v * 4 + q] = tmp.w[q] || 0; } }
  g.setAttribute("skinIndex", new THREE.Uint16BufferAttribute(si, 4)); g.setAttribute("skinWeight", new THREE.Float32BufferAttribute(sw, 4));
  PROF.push({ verts: nv, ms: Math.round(performance.now() - T0), sample: Math.round(time.sample), project: Math.round(time.project), weights: Math.round(performance.now() - w0) });
  return g;
}

// ============================================================
//  見た目
// ============================================================
const canvas = $("gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, low ? 1.5 : 2)); renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color("#f0ece4");
const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 50); camera.position.set(0.9, 0.95, 3.0);
const controls = new OrbitControls(camera, canvas); controls.target.set(0, 0.62, 0); controls.enableDamping = true; controls.minDistance = 0.7; controls.maxDistance = 6; controls.maxPolarAngle = Math.PI * 0.55;
const hemi = new THREE.HemisphereLight(0xffffff, 0xd8c8b8, 1.6); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(1.5, 3, 2.2); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -1.2, right: 1.2, top: 1.8, bottom: -0.4, near: 0.5, far: 8 }); sun.shadow.bias = -0.0008; scene.add(sun);
const floor = new THREE.Mesh(new THREE.CircleGeometry(1.6, 48), new THREE.MeshToonMaterial({ color: 0xe2d8c8 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
function size() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w / h < 0.8 ? 44 : 32; camera.updateProjectionMatrix(); }
addEventListener("resize", size); size();


// 骨
const { root: avatar, bone, skeleton, HIPS0 } = makeSkeleton({ J, PARENT, BONES }); scene.add(avatar);

const SKINS = ["#ffe0c8", "#f6d0b0", "#e8c8a8", "#c89a78", "#8a5f45"]; let skinI = 0;
const cmpMat = new THREE.MeshBasicMaterial({ color: 0x6fa8ff });   // 三面図で見本と重ねるときは、べた塗りの青(ずれが見分けやすい)   // ねんど色: なめらかな陰影(見本と同じ見え方)
function skinned(geo, color, ow = 0.005) {
  const m = new THREE.SkinnedMesh(geo, toon(color)); m.castShadow = true; m.frustumCulled = false; avatar.add(m); m.bind(skeleton);
  const o = new THREE.SkinnedMesh(geo, outlineMat(ow)); o.frustumCulled = false; o.userData.outline = true; avatar.add(o); o.bind(skeleton);
  return { m, o, on: true };
}

// ============================================================
//  顔(テクスチャ): 頭の前の網目を写した「顔レイヤー」に、パーツを重ねて描いた絵を正面から貼る
//  パーツは差し替え式。いまは仮の絵をコードで描いているが、あとで透過PNGに置き換えられる
// ============================================================
const FACE = { x0: -0.2, x1: 0.2, y0: 0.82, y1: 1.12, S: 2560, dy: FACE_DY };   // 顔の絵が受け持つ範囲(体の座標)と、1単位あたりのピクセル数
const faceCanvas = document.createElement("canvas"); faceCanvas.width = (FACE.x1 - FACE.x0) * FACE.S; faceCanvas.height = (FACE.y1 - FACE.y0) * FACE.S;
const fctx = faceCanvas.getContext("2d");
const faceTex = new THREE.CanvasTexture(faceCanvas); faceTex.colorSpace = THREE.SRGBColorSpace; faceTex.anisotropy = 4;
const faceMat = new THREE.MeshBasicMaterial({ map: faceTex, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
const px = (x) => (x - FACE.x0) * FACE.S, py = (y) => (FACE.y1 - y - FACE.dy) * FACE.S, pu = (d) => d * FACE.S;   // 体の座標 → 絵のピクセル
const INK = "#3a2632", MOUTH = "#b8475e";
const EYE_SIZE = 1.25;   // 目の大きさ
const EYE_COL = ["#2c3858", "#4f6a9a", "#8aa3cc", "#cfdcef"];   // 虹彩の色(上の暗い色 → 下の明るい色)
// 目・眉・ほっぺはキャラの左側(+x)を描き、右側は左右反転して写す
const EYE = { x: 0.112, y: 0.998 }, BROW = { x: 0.112, y: OPT.face.layout.browY }, MOUTHP = { x: 0, y: 0.896 }, CHEEK = { x: 0.152, y: 0.955 };
const line = (w, c = INK) => { fctx.lineWidth = pu(w); fctx.strokeStyle = c; fctx.lineCap = "round"; fctx.lineJoin = "round"; };
const ell = (x, y, rx, ry, fill) => { fctx.beginPath(); fctx.ellipse(px(x), py(y), pu(rx), pu(ry), 0, 0, Math.PI * 2); fctx.fillStyle = fill; fctx.fill(); };
const lash = (m, x, y, rx, lift) => { line(0.0075); fctx.beginPath(); fctx.moveTo(px(x - m * rx * 1.05), py(y - 0.004)); fctx.quadraticCurveTo(px(x), py(y + lift), px(x + m * rx * 1.15), py(y - 0.002)); fctx.lineTo(px(x + m * rx * 1.35), py(y + 0.006)); fctx.stroke(); };
// 描いてもらったパーツの絵(片側ぶん。右側は左右反転して使う)。下絵と切り出しは facekit/(face-template.psd → cut_face_parts.py)。w: 顔の上での横幅(0なら原寸 = 下絵と同じ1px) / dx, dy: 基準点からのずらし
const PART_IMG = { eye: { src: "img/parts/eye.png", w: OPT.face.images.eye.width, dx: OPT.face.images.eye.dx, dy: OPT.face.images.eye.dy }, brow: { src: "img/parts/brow.png", w: OPT.face.images.brow.width, dx: OPT.face.images.brow.dx, dy: OPT.face.images.brow.dy }, mouth: { src: "img/parts/mouth.png", w: OPT.face.images.mouth.width, dx: 0, dy: OPT.face.images.mouth.dy } };
for (const k in PART_IMG) { const im = new Image(); im.onload = () => { PART_IMG[k].img = im; if (typeof drawFace === "function") drawFace(); }; im.src = PART_IMG[k].src; }
const imgPart = (k, x, y) => { const p = PART_IMG[k]; if (!p.img) return; const w = p.w ? pu(p.w) : p.img.width, h = w * p.img.height / p.img.width; fctx.drawImage(p.img, px(x + p.dx) - w / 2, py(y + p.dy) - h / 2, w, h); };   // 基準点に絵の真ん中を合わせる
const PARTS = {
  eyes: {
    "絵の目": () => imgPart("eye", EYE.x, EYE.y),
    "まる目": () => {   // アニメの目: 白目・虹彩(上が暗く下が明るい)・瞳・ハイライト・太い上まつげ(目じりで跳ねる)・二重の線・下まぶた
      const { x: cx, y: cy } = EYE, P = (x, y) => [px(cx + x), py(cy + y)], mv = (x, y) => fctx.moveTo(...P(x, y)), qc = (a, b, x, y) => fctx.quadraticCurveTo(...P(a, b), ...P(x, y)), bz = (a, b, c, d, x, y) => fctx.bezierCurveTo(...P(a, b), ...P(c, d), ...P(x, y));
      const IR = EYE_COL; fctx.save(); fctx.translate(px(cx), py(cy)); fctx.scale(EYE_SIZE, EYE_SIZE); fctx.translate(-px(cx), -py(cy));   // 大きさは EYE_SIZE で
      // 目の形(白目)
      const open = () => { fctx.beginPath(); mv(-0.033, 0.0); bz(-0.03, 0.03, 0.012, 0.042, 0.042, 0.016); bz(0.042, -0.012, 0.022, -0.038, -0.002, -0.038); bz(-0.02, -0.038, -0.034, -0.02, -0.033, 0.0); fctx.closePath(); };
      open(); { const g = fctx.createLinearGradient(...P(0, 0.04), ...P(0, -0.03)); g.addColorStop(0, "#c9c6cf"); g.addColorStop(0.35, "#f3f1f2"); g.addColorStop(1, "#fbfafa"); fctx.fillStyle = g; fctx.fill(); }
      fctx.save(); open(); fctx.clip();
      // 虹彩
      const ir = () => { fctx.beginPath(); fctx.ellipse(...P(-0.001, -0.003), pu(0.027), pu(0.037), 0, 0, Math.PI * 2); };
      ir(); { const g = fctx.createLinearGradient(...P(0, 0.034), ...P(0, -0.04)); g.addColorStop(0, IR[0]); g.addColorStop(0.42, IR[1]); g.addColorStop(0.78, IR[2]); g.addColorStop(1, IR[3]); fctx.fillStyle = g; fctx.fill(); }
      fctx.save(); ir(); fctx.clip();
      ell(cx - 0.001, cy - 0.03, 0.022, 0.016, IR[3] + "c0");                                   // 下の明るい三日月
      ell(cx - 0.001, cy + 0.03, 0.03, 0.022, IR[0] + "b0");                                    // 上まつげの影
      fctx.restore();
      ell(cx - 0.001, cy + 0.0, 0.0085, 0.014, "#2a1c22");                                      // 瞳
      line(0.0024, "#2b2533"); ir(); fctx.stroke();                                              // 虹彩のふち
      fctx.restore();
      // 下まぶた(細い線、目じり寄り)
      line(0.0022, "#6a4c50"); fctx.beginPath(); mv(0.006, -0.0375); qc(0.03, -0.034, 0.04, -0.012); fctx.stroke();
      // 上まつげ(内側は細く、目じりへ太く、最後に外へ跳ねる)
      fctx.beginPath(); mv(-0.035, -0.002); bz(-0.031, 0.031, 0.012, 0.045, 0.043, 0.02); qc(0.05, 0.012, 0.056, 0.0); qc(0.047, 0.006, 0.04, 0.009);
      bz(0.012, 0.034, -0.026, 0.024, -0.033, 0.002); fctx.closePath(); fctx.fillStyle = "#3a2830"; fctx.fill();
      // 二重の線
      line(0.0028, "#c98c80"); fctx.beginPath(); mv(-0.016, 0.046); qc(0.012, 0.056, 0.036, 0.04); fctx.stroke();
      // ハイライト
      ell(cx - 0.012, cy + 0.014, 0.0085, 0.0085, "#ffffff"); ell(cx + 0.012, cy - 0.018, 0.0035, 0.0035, "#ffffffe0"); ell(cx - 0.004, cy + 0.002, 0.0022, 0.0022, "#ffffffd0");
      fctx.restore();
    },
    "まる目(前)": (m) => { const { x, y } = EYE, rx = 0.035, ry = 0.047;   // ひとつ前の、塗りつぶしの丸い目
      const g = fctx.createLinearGradient(0, py(y + ry), 0, py(y - ry)); g.addColorStop(0, "#2a1b26"); g.addColorStop(0.55, "#4a3042"); g.addColorStop(1, "#8a5a72");
      ell(x, y, rx, ry, g); ell(x, y - 0.004, rx * 0.5, ry * 0.55, "#21141d");

  for (const x of all()) { x.m.visible = x === body || (x.on && !clay); x.m.material.wireframe = wire; x.o.visible = x.m.visible && !clay && !wire; }
  faceLayer.visible = !clay; floor.visible = !compare;
}
const hairMesh = (H) => skinned(mesh(hairSdf, [-0.34, 0.8, -0.36], [0.34, 1.48, 0.38], H * OPT.quality.hairCell, "head"), "#6a4a30", 0.004);
function makeHair(H) { const h = hairMesh(H); $("tBangs").textContent = `前髪: ${HAIR_PICK.bangs}`; $("tBack").textContent = `後ろ髪: ${HAIR_PICK.back}`; return h; }
function rebuildHair() {   // 髪だけ作り直す
  const on = hair.on; for (const m of [hair.m, hair.o]) { avatar.remove(m); m.geometry.dispose(); }
  hairSdf = hairSdfOf(); hair = makeHair(low ? 0.0095 : 0.0068); hair.on = on; refreshLook();
}
// 顔の陰: 陰を計算するときの面の向きだけを、なめらかな楕円(頭と顔の丸み)から借りる。形はそのままで、アニメ塗りの境目がガタつかない(ねんど色は本当の向きのまま)
const FACE_SHADE = { w: OPT.face.shading.weight, c: [0, OPT.face.shading.y, OPT.face.shading.z], r: [0.25, OPT.face.shading.radiusY, OPT.face.shading.radiusZ] };   // 借りる強さ / 楕円の中心 / 半径
function addShadeNormals(geo) {
  const P = geo.attributes.position.array, N = geo.attributes.normal.array, S = new Float32Array(N.length), F = FACE_SHADE, ears = [1, -1].map((m) => [m * EAR.x, EAR.y, -0.022]);
  for (let i = 0; i < P.length; i += 3) { const x = P[i], y = P[i + 1], z = P[i + 2];
    let w = F.w * sstep(0.86, 0.93, y); for (const e of ears) w *= sstep(0.05, 0.1, Math.hypot(x - e[0], y - e[1], z - e[2]));   // 首から上だけ。耳は自分の陰のまま
    const ex = (x - F.c[0]) / F.r[0] ** 2, ey = (y - F.c[1]) / F.r[1] ** 2, ez = (z - F.c[2]) / F.r[2] ** 2, el = Math.hypot(ex, ey, ez) || 1;
    const sx = N[i] + (ex / el - N[i]) * w, sy = N[i + 1] + (ey / el - N[i + 1]) * w, sz = N[i + 2] + (ez / el - N[i + 2]) * w, sl = Math.hypot(sx, sy, sz) || 1;
    S[i] = sx / sl; S[i + 1] = sy / sl; S[i + 2] = sz / sl; }
  geo.setAttribute("shadeN", new THREE.BufferAttribute(S, 3));
}
function shadeToon(c) { const m = toon(c); m.onBeforeCompile = (sh) => { sh.vertexShader = "attribute vec3 shadeN;\n" + sh.vertexShader.replace("#include <beginnormal_vertex>", "vec3 objectNormal = shadeN;"); }; return m; }
// 顔の下絵づくり用: 顔の絵と同じ座標(1024×768)で、正面からまっすぐ撮った頭の画像と、パーツの基準点を返す(tools/facekit が使う)
globalThis.sotaiFaceSheet = (mode = "skin") => {
  const W = faceCanvas.width, Hc = faceCanvas.height, yc = (FACE.y0 + FACE.y1) / 2;
  const cam = new THREE.OrthographicCamera(FACE.x0, FACE.x1, FACE.y1 - yc, FACE.y0 - yc, 0.1, 10); cam.position.set(0, yc, 3); cam.lookAt(0, yc, 0);
  skeleton.pose(); for (const x of all()) { x.m.visible = x === body; x.o.visible = x === body && mode !== "clay"; } faceLayer.visible = false; floor.visible = false; helper.visible = false;
  body.m.material = mode === "clay" ? clayMat : body.toonMat;
  const pr = renderer.getPixelRatio(); renderer.setPixelRatio(1); renderer.setSize(W, Hc, false); renderer.render(scene, cam);
  const url = renderer.domElement.toDataURL("image/png");
  renderer.setPixelRatio(pr); size(); refreshLook();
  const at = (k, a) => [px(a.x + PART_IMG[k].dx), py(a.y + PART_IMG[k].dy)];   // パーツの絵の真ん中が来る点(絵のピクセル)
  return { url, size: [W, Hc], anchors: { eye: at("eye", EYE), brow: at("brow", BROW), mouth: at("mouth", MOUTHP) } };
};
globalThis.sotaiChecksum = () => all().map((x) => { const g = x.m.geometry, a = g.attributes; let h = 0; for (const k of ["position", "skinIndex", "skinWeight"]) { const v = a[k].array; for (let i = 0; i < v.length; i++) h = (h * 31 + Math.round(v[i] * 1e5)) % 1000000007; } return h; });   // 確認用: 網目と重みの指紋
function build() {
  const t0 = performance.now(), H = low ? 0.0095 : 0.0068;
  bodyAt = (x, y, z) => bodySdf(x, y, z); body = skinned(mesh(bodySdf, [-0.47, -0.02, -0.3], [0.47, 1.43, 0.34], H), SKINS[skinI]); bodyAt = gridSampler(mesh.last, bodySdf);   // 体の格子を服に使い回す
  addShadeNormals(body.m.geometry); body.m.material.dispose(); body.m.material = body.toonMat = shadeToon(SKINS[skinI]);
  shirt = skinned(mesh(shirtSdf, [-0.3, 0.33, -0.2], [0.3, 0.86, 0.22], H * OPT.quality.shirtCell, null, /^(hips|spine|chest|upperChest|neck|upperArm)/, FAST.shirt), "#7fb6e8");
  pants = skinned(mesh(pantsSdf, [-0.28, 0.2, -0.2], [0.28, 0.55, 0.22], H * 1.2, null, /^(hips|spine|upperLeg|lowerLeg)/, FAST.pants), "#5a4f7a");
  shoes = skinned(mesh(shoeSdf, [-0.22, -0.01, -0.12], [0.22, 0.13, 0.14], H * 0.7, null, /^(foot|lowerLeg)/), "#c8564b");
  soles = skinned(mesh(soleSdf, [-0.22, -0.01, -0.12], [0.22, 0.03, 0.14], H * 0.6, null, /^foot/), "#f4f1ea");
  socks = skinned(mesh(sockSdf, [-0.22, -0.01, -0.12], [0.22, 0.17, 0.14], H * 0.7, null, /^(foot|lowerLeg)/, FAST.sock), "#f7f3ea", 0.003);
  hair = makeHair(H);
  buildFaceLayer(body.m.geometry); drawFace(); refreshLook();
  const nv = all().reduce((s, x) => s + x.m.geometry.attributes.position.count, 0);
  $("stat").textContent = `頂点 ${nv.toLocaleString()} / 骨 ${BONES.length} / 生成 ${Math.round(performance.now() - t0)}ms`;
}

// ── UI ──
const toggle = (id, fn) => { const b = $(id); b.addEventListener("click", () => { const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", String(on)); fn(on); }); };
toggle("tCloth", (on) => { shirt.on = pants.on = on; refreshLook(); });
toggle("tShoe", (on) => { shoes.on = soles.on = on; refreshLook(); });
toggle("tSock", (on) => { socks.on = on; refreshLook(); });
toggle("tHair", (on) => { hair.on = on; refreshLook(); });
toggle("tClay", (on) => { clay = on; refreshLook(); });
toggle("tCmp", (on) => { compare = on; $("tRef").hidden = !on; $("ref").hidden = !on || $("tRef").getAttribute("aria-pressed") !== "true"; $("poses").hidden = on; if (on && !clay) $("tClay").click(); refreshLook(); });
toggle("tRef", (on) => { $("ref").hidden = !on; refreshLook(); });
const helper = new THREE.SkeletonHelper(avatar); helper.visible = false; helper.material.depthTest = false; scene.add(helper);
toggle("tBone", (on) => { helper.visible = on; for (const m of [clayMat, body.toonMat, shirt.m.material, pants.m.material, shoes.m.material, soles.m.material, socks.m.material, hair.m.material]) { m.transparent = on; m.opacity = on ? 0.45 : 1; } });
toggle("tWire", (on) => { wire = on; refreshLook(); });
$("tFace").addEventListener("click", () => { faceI = (faceI + 1) % FACES.length; Object.assign(faceSel, PRESETS[FACES[faceI]]); drawFace(); });
const cyc = (id, slot) => $(id).addEventListener("click", () => { const k = Object.keys(PARTS[slot]); faceSel[slot] = k[(k.indexOf(faceSel[slot]) + 1) % k.length]; drawFace(); });
for (const [id, key, list] of [["tBangs", "bangs", BANGS], ["tBack", "back", BACKS]]) $(id).addEventListener("click", () => { const k = Object.keys(list); HAIR_PICK[key] = k[(k.indexOf(HAIR_PICK[key]) + 1) % k.length]; rebuildHair(); });
for (const [id, k] of [["fiY", "y"], ["fiX", "x"], ["fiS", "s"]]) { $(id).value = FACE_IMG[k]; $(id).addEventListener("input", () => { FACE_IMG[k] = +$(id).value; drawFace(); }); }
toggle("tWrap", (on) => { FACE_WRAP = on ? WRAP : null; $("tWrap").textContent = on ? "貼り方: 巻きつけ" : "貼り方: 正面から"; buildFaceLayer(body.m.geometry); refreshLook(); });
toggle("tFaceImg", (on) => { FACE_IMG.on = on; $("fimgPanel").hidden = !on; $("tFaceImg").textContent = on ? "顔: 絵(PNG)" : "顔: コードの絵"; drawFace(); });
$("fiFile").addEventListener("change", (e) => { const f = e.target.files[0]; if (f) loadFaceImg(URL.createObjectURL(f)); });
cyc("tEyes", "eyes"); cyc("tBrow", "brows"); cyc("tMouth", "mouth");
$("tSkin").addEventListener("click", () => { skinI = (skinI + 1) % SKINS.length; if (clay) $("tClay").click(); else refreshLook(); });
$("tExport").addEventListener("click", async () => {
  const { GLTFExporter } = await import("three/addons/exporters/GLTFExporter.js");
  const outs = []; avatar.traverse((o) => { if (o.userData.outline && o.visible) { o.visible = false; outs.push(o); } });
  const saved = BONES.map((b) => bone[b].quaternion.clone()), hy = bone.hips.position.y;
  BONES.forEach((b) => bone[b].quaternion.identity()); bone.hips.position.copy(HIPS0);   // Aポーズで書き出す
  new GLTFExporter().parse(avatar, (buf) => {
    outs.forEach((o) => { o.visible = true; }); BONES.forEach((b, i) => bone[b].quaternion.copy(saved[i])); bone.hips.position.y = hy;
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([buf], { type: "model/gltf-binary" })); a.download = "saon-sotai.glb"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, (e) => { console.error(e); outs.forEach((o) => { o.visible = true; }); }, { binary: true });
});
for (const name of Object.keys(POSES)) { const b = document.createElement("button"); b.className = "btn"; b.type = "button"; b.textContent = name; b.setAttribute("aria-pressed", String(name === poseName)); b.addEventListener("click", () => { poseName = name; [...$("poses").children].forEach((x) => x.setAttribute("aria-pressed", String(x === b))); }); $("poses").append(b); }

setTimeout(() => {
  build(); $("msg").hidden = true;
  if (/[?&]cmp/.test(location.search)) $("tCmp").click();
  const Q = new URLSearchParams(location.search), HT = [0.35, 0.5, 0.01];   // 確認用: ?view=front&pose=歩く など
  const VIEW = { front: [0, 0.95, 3.0], q: [1.3, 0.9, 2.6], side: [3.0, 0.9, 0.02], back: [-1.3, 1.0, -2.6], face: [0.45, 1.05, 1.35, 0, 1.0, 0], face2: [0.6, 1.12, 1.25, 0, 0.97, 0], above: [0.05, 2.1, 0.75, 0, 0.95, 0.05], side34: [0.9, 1.05, 0.75, 0, 0.95, 0.05], earR: [0.3, 1.0, 0.75, 0.27, 0.99, 0], arm: [0.25, 0.62, 0.9, 0.23, 0.6, 0], armd: [0.3, 0.4, 0.75, 0.25, 0.56, 0], sideR: [-2.3, 0.55, 0.02, 0, 0.42, 0], top: [0, 2.0, 0.5, 0, 1.0, 0.05], noseside2: [0.6, 0.9, 0.24, 0, 0.9, 0.24], noseside: [0.7, 0.93, 0.24, 0, 0.93, 0.24], ear: [0.75, 1.05, -0.35, 0.2, 1.0, -0.03], earf: [0.55, 1.02, 0.6, 0.2, 1.0, -0.03],
    nose: [0.32, 1.0, 0.75, 0, 0.96, 0.15], hand: [0.62, 0.66, 0.42, ...HT], handf: [0.36, 0.5, 0.55, ...HT], hands: [0.75, 0.45, 0.02, ...HT] }[Q.get("view")];
  if (VIEW) { camera.position.set(...VIEW.slice(0, 3)); if (VIEW.length > 3) controls.target.set(...VIEW.slice(3)); }
  const qp = [...$("poses").children].find((x) => x.textContent === Q.get("pose")); if (qp) qp.click();
  let last = performance.now(), T = 0;   // ?t=0.25 のように時刻を止めて確認できる
  (function frame(now) { requestAnimationFrame(frame); const dt = Math.min(0.05, (now - last) / 1000); last = now; T = Q.has("t") ? +Q.get("t") : T + dt; applyPose(T, dt); blinkTick(T);
    if (compare) renderCompare(); else { controls.update(); renderer.render(scene, camera); } })(last);
