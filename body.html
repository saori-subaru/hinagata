<!--
  🧸新しいアバターの「素体」の試作。ピーロの体を使わず、ぜんぶコードで作る。
  ・寸法は見本の三面図(img/sotai-ref.jpg)から測った: 身長519px=1.4、約2.4頭身、首はほぼ無し、なで肩、ぽっこりおなか、短くて太い脚、指を開いた手
  ・体の形: 丸い形(楕円体と、太さの変わるカプセル)を置いて、なめらかに溶け合わせた1枚の肌にする(符号つき距離 → サーフェスネッツで網目)
  ・骨: 17本(腰・背骨・胸・首・頭 / 左右の 上腕・前腕・手 / 左右の 太もも・すね・足)。重みは「どの部品にいちばん近いか」から自動
  ・服と髪: 体を少しふくらませて、いらない所を切り取って作る → 体型が変わっても自動で合い、同じ骨で動く
  ・「三面図」: 見本と同じ縮尺・同じ位置で正面/横/後ろを描き、見本の画像を重ねて比べられる(URLに ?cmp でも開く)
  ・「glTFを書き出す」で .glb を保存(Blender でそのまま開ける)
-->
<script type="importmap">

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = (id) => document.getElementById(id);
const low = matchMedia("(pointer: coarse)").matches || innerWidth < 820;

// ============================================================
//  形(符号つき距離)。身長 1.4、正面は +z、キャラの左手が +x
// ============================================================
import { smin, E, axes, cut, G, C, dPrim, blend, blendFast, plane, sstep } from "./src/sdf/prim.js";   // 形の部品・溶け合わせ
import { grad, grad4, surfaceNets, gridSampler } from "./src/sdf/mesh.js";   // 網目にする
import { ramp, toon, outlineMat, CLAY, clayMat } from "./src/materials.js";   // アニメ塗り・輪郭線・ねんど色

// 関節(骨のつけ根)。寸法は見本から
const FOOT_X = +(new URLSearchParams(location.search).get("fx") || 0.116);   // 足首の横位置(小さいほど内側に着く。がに股に見えないように)
const KNEE_X = +(new URLSearchParams(location.search).get("kx") || 0.108);   // 膝の横位置(足首を内側に寄せたのに合わせる)
const J = {
  hips: [0, 0.42, 0], spine: [0, 0.5, 0.01], chest: [0, 0.62, 0], upperChest: [0, 0.732, -0.005], neck: [0, 0.74, -0.005], head: [0, 0.82, 0],
  "upperArm.L": [0.115, 0.732, 0], "lowerArm.L": [0.232, 0.612, 0.005], "hand.L": [0.322, 0.52, 0.01],
  "upperLeg.L": [0.11, 0.4, 0], "lowerLeg.L": [KNEE_X, 0.25, -0.006], "foot.L": [FOOT_X, 0.085, -0.005],
};
for (const k of Object.keys(J)) if (k.endsWith(".L")) { const v = J[k]; J[k.replace(".L", ".R")] = [-v[0], v[1], v[2]]; }
const PARENT = { hips: null, spine: "hips", chest: "spine", upperChest: "chest", neck: "upperChest", head: "neck" };   // upperChest: 両肩をつなぐ点(肩の高さ)
for (const s of ["L", "R"]) Object.assign(PARENT, { [`upperArm.${s}`]: "upperChest", [`lowerArm.${s}`]: `upperArm.${s}`, [`hand.${s}`]: `lowerArm.${s}`, [`upperLeg.${s}`]: "hips", [`lowerLeg.${s}`]: `upperLeg.${s}`, [`foot.${s}`]: `lowerLeg.${s}` });
const BONES = Object.keys(PARENT);
const BI = Object.fromEntries(BONES.map((b, i) => [b, i]));

// 体の部品(見本の正面・横のシルエットに合わせた)
const FOOT_H = +(new URLSearchParams(location.search).get("fh") || 0.029);   // 足の厚み(平たく)
const SHOULDER_DROP = +(new URLSearchParams(location.search).get("sdrop") || 0.008);   // 肩の頂点を下げる量(なで肩に)
const P = {}, CUT = {};
const FACE_DY = -0.015;   // 顔の絵と眼窩をまとめて上下にずらす量
const WRAP = { zc: -0.02, r: 0.24 }; let FACE_WRAP = /[?&]wrap/.test(location.search) ? WRAP : null;   // 顔の絵の貼り方: null=正面からまっすぐ / { zc, r }=頭のまわりに巻きつける
const SOCKET_OUT = 0.065;
const TEMPLE_Z0 = +(new URLSearchParams(location.search).get("tz0") || 0.09);   // これより後ろ(顔の横)は前へ出さない
const TEMPLE = { d: +(new URLSearchParams(location.search).get("td") || 0.006), x: +(new URLSearchParams(location.search).get("tx") || 0.19), y: +(new URLSearchParams(location.search).get("ty") || 0.98), w: 0.06, h: +(new URLSearchParams(location.search).get("th") || 0.13) };   // 目じりの横を前へ出す量 / 中心の横位置 / 横・縦の広がり
const SIDE_TRIM = { d: +(new URLSearchParams(location.search).get("sd") || 0.008), x: +(new URLSearchParams(location.search).get("sx") || 0.2), y: +(new URLSearchParams(location.search).get("sy") || 0.9), w: +(new URLSearchParams(location.search).get("sw") || 0.05), h: +(new URLSearchParams(location.search).get("sh") || 0.08) };   // ほおの横を抑える量 / 位置 / 広がり
const CHEEK_FILL = { d: +(new URLSearchParams(location.search).get("cf") || 0.008), x: +(new URLSearchParams(location.search).get("cfx") || 0.125), y: +(new URLSearchParams(location.search).get("cfy") || 0.905), w: +(new URLSearchParams(location.search).get("cfw") || 0.095), h: +(new URLSearchParams(location.search).get("cfh") || 0.06) };   // 目の下のほおを足す量 / 位置 / 広がり
const EYE_UNDER = { d: +(new URLSearchParams(location.search).get("eud") || 0.01), x: +(new URLSearchParams(location.search).get("eux") || 0.105), y: +(new URLSearchParams(location.search).get("euy") || -0.032), wi: +(new URLSearchParams(location.search).get("euwi") || 0.05), wo: +(new URLSearchParams(location.search).get("euwo") || 0.032), h: +(new URLSearchParams(location.search).get("euh") || 0.035) };   // 目の下半分のうしろだけを沈める(眼窩の外側は触らない): 量 / 中心 / 目頭側・目じり側の広がり / 上下の広がり
const SOCK_IN = { d: +(new URLSearchParams(location.search).get("sid") || 0.005), x: +(new URLSearchParams(location.search).get("six") || 0.075), w: +(new URLSearchParams(location.search).get("siw") || 0.055), h: 0.065 };   // 眼窩の目頭側を引っこめる量 / 位置 / 広がり
const SOCK_BAND = { on: !/[?&]oldsock/.test(location.search), len: +(new URLSearchParams(location.search).get("blen") || 0.11), lift: +(new URLSearchParams(location.search).get("blift") || 0.6) };   // 眼窩の目じり側: 届く長さ / 外側を浅くする(前へ出す)割合
const SOCKET_LOW = { d: +(new URLSearchParams(location.search).get("low") || 0.014), y: 0.035, w: 0.085, h: 0.06, hu: +(new URLSearchParams(location.search).get("lhu") || 0.11) };   // 上側は広くゆっくり消す(段が出ないように)   // 眼窩の下側を沈める量 / 中心の下がり / 横・縦の広がり   // 眼窩の外側(こめかみ側)への広がり
const EAR = { flare: 0.7, tilt: 0.3, x: 0.24, y: +(new URLSearchParams(location.search).get("eary") || 0.983), lean: 0.6 };   // 耳: 後ろの縁の開き / 上ほど外へ倒す量 / 位置
P.neck = C([0, 0.725, -0.032], [0, 0.845, 0.006], 0.057, 0.056, "neck", 0.04);   // 首: 太さの変わらない柱を、上が前へ来るように少し倒す
P.trap = E([0, 0.77, -0.016], [0.12, 0.03, 0.056], "chest", 0.035);   // 首の根元から肩へ: 高めの位置から肩へつなぐ(首は台形に広げない)
P.chest = E([0, 0.68, 0.015], [0.13, 0.1, 0.1], "chest", 0.05);       // 胸は細め(脇の下を高くする)
P.belly = E([0, 0.52, 0.035], [0.165, 0.14, 0.115], "spine", 0.1);  // おなかはぽっこり(下ぶくれ)
P.pelvis = E([0, 0.435, -0.005], [0.157, 0.072, 0.1], "hips", 0.09);
// 頭: 中だけでなめらかに溶かして、首とはくっきり分ける
P.skull = E([0, 1.137, -0.005], [0.249, 0.26, 0.262], "head", 0.06);   // 頭(大きな丸。横幅・前後とも見本どおり)
P.occiput = E([0, 1.0, -0.07], [0.17, 0.09, 0.14], "head", 0.08);   // 後頭部の下(首の上まで丸くふくらむ)
P.face = E([0, 0.935, 0.08], [0.2, 0.115, 0.168], "head", 0.08);   // ほお〜あご(頭と同じ幅のまま下りて、なめらかにすぼまる)
P.jaw = E([0, 0.868, 0.094], [0.112, 0.062, 0.142], "head", 0.07);      // あご先(下は平らぎみ)
P.muzzle = E([0, +(new URLSearchParams(location.search).get("my") || 0.925), 0.17], [0.075, 0.075, 0.1], "head", 0.05);   // 口まわりのふくらみ(鼻の下がへこまず、あごまでなめらかに続く)
const NOSE_DY = -0.035;
const NOSE_Z = +(new URLSearchParams(location.search).get("nz") || 0.267);   // 鼻先の前後(前は0.273。少し内側へ)
const LIP_CURVE = +(new URLSearchParams(location.search).get("pb") || 45);   // 鼻の下〜あご: 鼻先から1本のなめらかな弧になるよう、上ほど前へ反らせる
P.muzzle2 = E([0, +(new URLSearchParams(location.search).get("m2y") || 0.905), 0.243], [0.035, 0.045, 0.04], "head", 0.03);   // その弧の下地(前を削る面で形が決まる)
const NOSE_UNDER = { dent: +(new URLSearchParams(location.search).get("nd") || 0), dy: +(new URLSearchParams(location.search).get("ndy") || 0.915), y: +(new URLSearchParams(location.search).get("ny") || -0.002), slope: +(new URLSearchParams(location.search).get("ns") || 0.5) };   // 鼻の下側を切る線: 先端からの下がり / 傾き(奥へ)
const MOUTH_FREE = +(new URLSearchParams(location.search).get("mf") || 0.95);   // 鼻の下を削る面を、この高さより上では前へ逃がす   // 鼻(鼻筋・付け根の凹みごと)を顔の絵の鼻の点に合わせて下げる量
{ const c = C([0, 0.976 + NOSE_DY, 0.238], [0, 0.964 + NOSE_DY, NOSE_Z], 0.012, +(new URLSearchParams(location.search).get("nr") || 0.0045), "head"), yt = 0.964 + NOSE_DY - NOSE_UNDER.y, zt = NOSE_Z + 0.007, sl = NOSE_UNDER.slope, L = Math.hypot(1, sl);
  P.nose = { t: 3, k: +(new URLSearchParams(location.search).get("nk") || 0.02), bone: "head", bx0: c.bx0, by0: c.by0, bz0: c.bz0, br: c.br,   // 鼻: 付け根から急に立ち上がって、先が尖る。下側は先端からまっすぐ奥へ切る(先端をひとつに)
    f: (x, y, z) => Math.max(dPrim(c, x, y, z), ((z - zt) - (y - yt) * sl) / L) }; }
CUT.nasion = cut(E([0, 1.005 + NOSE_DY, 0.266], [0.05, 0.035, 0.025], "head", 0.025));   // 鼻の付け根(凹みのいちばん深いところ)
CUT.brow = cut(E([0, 1.012 + NOSE_DY, 0.314], [0.19, 0.05, 0.07], "head", 0.05));   // 目の高さを横にゆるく凹ませる
CUT.chin = plane((x, y) => (y - 0.835 + 0.014 * Math.exp(-x * x / 0.0032) - 0.95 * x * x) / Math.sqrt(1 + 4 * x * x), 0.015);   // あご先: 顔の中心の一点だけ少し下げる   // あごの下: 真ん中の一点がいちばん低く、左右へ上がる
CUT.mouth = plane((x, y, z) => (0.222 + 0.9 * (y - 0.842) - 3.9 * (y - 0.842) ** 2 + LIP_CURVE * Math.max(0, y - 0.86) ** 3 + 10 * Math.max(0, y - MOUTH_FREE) ** 2 - NOSE_UNDER.dent * Math.exp(-(((y - NOSE_UNDER.dy) / 0.014) ** 2)) - z) / 1.15, 0.015);   // 鼻の下〜あご先は、なめらかに奥へ下がる斜めの面(鼻のところでは前へ逃がす)
CUT.crown = plane((x, y) => +(new URLSearchParams(location.search).get("crown") || 1.39) - y, +(new URLSearchParams(location.search).get("crk") || 0.02));   // 頭のてっぺんを少しだけ平たく
CUT.nape = plane((x, y, z) => (z + 0.15 + 3.5 * (y - 0.89)) / 3.64, 0.018);   // 後頭部の下は首の手前で内側へ巻き込む(首の後ろとの間にくびれ)
for (const [s, m] of [["L", 1], ["R", -1]]) {
  const j = (n) => J[`${n}.${s}`];
  // 耳: 前の縁は頭にぴったり付き、後ろの縁が外へ開いて浮く板。くぼみは前・外を向く(横から見ると前がまっすぐのD字)
  const nrm = (v) => { const l = Math.hypot(...v); return v.map((c) => c / l); }, dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const eu = nrm([m * EAR.flare, 0, -1]), ev0 = [m * EAR.tilt, 1, 0], ev = nrm(ev0.map((c, i) => c - dot(ev0, eu) * eu[i]));
  const ew = [eu[1] * ev[2] - eu[2] * ev[1], eu[2] * ev[0] - eu[0] * ev[2], eu[0] * ev[1] - eu[1] * ev[0]].map((c) => c * m), ec = [m * EAR.x, EAR.y, -0.022];   // ew: 耳の表(前・外向き)
  { const c = Math.cos(EAR.lean), sn = Math.sin(EAR.lean), u = eu.slice(), v = ev.slice(); for (let i = 0; i < 3; i++) { eu[i] = u[i] * c - v[i] * sn; ev[i] = v[i] * c + u[i] * sn; } }   // 上を後ろへ倒す(横から見て上が広い形に)
  { const e0 = E(ec, [0.062, 0.067, 0.019], "head", 0.02, [eu, ev, ew]), ta = +(new URLSearchParams(location.search).get("eta") || 0.35), tc = +(new URLSearchParams(location.search).get("etc") || 0.04), n = eu.map((c, i) => c * Math.cos(ta) - ev[i] * Math.sin(ta));
    P[`ear.${s}`] = { ...e0, t: 3, f: (x, y, z) => -smin(-dPrim(e0, x, y, z), -(n[0] * (x - ec[0]) + n[1] * (y - ec[1]) + n[2] * (z - ec[2]) - tc), 0.012) }; }   // 耳の後ろの下側をななめに落として、下へ細くとがらせる
  CUT[`ear.${s}`] = cut(E(ec.map((v, i) => v + ew[i] * 0.025 + eu[i] * 0.024), [0.026, 0.042, 0.011], "head", 0.014, [eu, ev, ew]));   // 耳の内側のくぼみ
  P[`butt.${s}`] = E([m * 0.07, 0.452, -0.05], [0.08, 0.066, 0.075], "hips", 0.05);
  P[`shoulder.${s}`] = E([m * 0.116, 0.742 - SHOULDER_DROP, 0], [0.054, 0.045 - SHOULDER_DROP * 0.6, 0.048], `upperArm.${s}`, 0.04);   // なで肩

// ── UI ──

toggle("tCloth", (on) => { shirt.on = pants.on = on; refreshLook(); });

toggle("tHair", (on) => { hair.on = on; refreshLook(); });
toggle("tClay", (on) => { clay = on; refreshLook(); });
toggle("tCmp", (on) => { compare = on; $("tRef").hidden = !on; $("ref").hidden = !on || $("tRef").getAttribute("aria-pressed") !== "true"; $("poses").hidden = on; if (on && !clay) $("tClay").click(); refreshLook(); });

for (const [id, key, list] of [["tBangs", "bangs", BANGS], ["tBack", "back", BACKS]]) $(id).addEventListener("click", () => { const k = Object.keys(list); HAIR_PICK[key] = k[(k.indexOf(HAIR_PICK[key]) + 1) % k.length]; rebuildHair(); });
for (const [id, k] of [["fiY", "y"], ["fiX", "x"], ["fiS", "s"]]) { $(id).value = FACE_IMG[k]; $(id).addEventListener("input", () => { FACE_IMG[k] = +$(id).value; drawFace(); }); }
toggle("tWrap", (on) => { FACE_WRAP = on ? WRAP : null; $("tWrap").textContent = on ? "貼り方: 巻きつけ" : "貼り方: 正面から"; buildFaceLayer(body.m.geometry); refreshLook(); });

cyc("tEyes", "eyes"); cyc("tBrow", "brows"); cyc("tMouth", "mouth");
$("tSkin").addEventListener("click", () => { skinI = (skinI + 1) % SKINS.length; if (clay) $("tClay").click(); else refreshLook(); });
$("tExport").addEventListener("click", async () => {
  const { GLTFExporter } = await import("three/addons/exporters/GLTFExporter.js");
  const outs = []; avatar.traverse((o) => { if (o.userData.outline && o.visible) { o.visible = false; outs.push(o); } });
  const saved = BONES.map((b) => bone[b].quaternion.clone()), hy = bone.hips.position.y;
  BONES.forEach((b) => bone[b].quaternion.identity()); bone.hips.position.copy(HIPS0);   // Aポーズで書き出す
  new GLTFExporter().parse(avatar, (buf) => {
    outs.forEach((o) => { o.visible = true; }); BONES.forEach((b, i) => bone[b].quaternion.copy(saved[i])); bone.hips.position.y = hy;
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([buf], { type: "model/gltf-binary" })); a.download = "saon-sotai.glb"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, (e) => { console.error(e); outs.forEach((o) => { o.visible = true; }); }, { binary: true });
});
for (const name of Object.keys(POSES)) { const b = document.createElement("button"); b.className = "btn"; b.type = "button"; b.textContent = name; b.setAttribute("aria-pressed", String(name === poseName)); b.addEventListener("click", () => { poseName = name; [...$("poses").children].forEach((x) => x.setAttribute("aria-pressed", String(x === b))); }); $("poses").append(b); }

  if (/[?&]cmp/.test(location.search)) $("tCmp").click();
  const Q = new URLSearchParams(location.search), HT = [0.35, 0.5, 0.01];   // 確認用: ?view=front&pose=歩く など
  const VIEW = { front: [0, 0.95, 3.0], q: [1.3, 0.9, 2.6], side: [3.0, 0.9, 0.02], back: [-1.3, 1.0, -2.6], face: [0.45, 1.05, 1.35, 0, 1.0, 0], face2: [0.6, 1.12, 1.25, 0, 0.97, 0], above: [0.05, 2.1, 0.75, 0, 0.95, 0.05], side34: [0.9, 1.05, 0.75, 0, 0.95, 0.05], earR: [0.3, 1.0, 0.75, 0.27, 0.99, 0], arm: [0.25, 0.62, 0.9, 0.23, 0.6, 0], armd: [0.3, 0.4, 0.75, 0.25, 0.56, 0], sideR: [-2.3, 0.55, 0.02, 0, 0.42, 0], top: [0, 2.0, 0.5, 0, 1.0, 0.05], noseside2: [0.6, 0.9, 0.24, 0, 0.9, 0.24], noseside: [0.7, 0.93, 0.24, 0, 0.93, 0.24], ear: [0.75, 1.05, -0.35, 0.2, 1.0, -0.03], earf: [0.55, 1.02, 0.6, 0.2, 1.0, -0.03],
