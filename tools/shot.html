<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Hinagata — shots of a preset</title>
<style>body { margin: 0; padding: 12px; background: #f0ece4; font: 13px sans-serif; } img { max-width: 100%; }</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/", "meshoptimizer": "https://cdn.jsdelivr.net/npm/meshoptimizer@1/index.js", "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/", "three-gpu-pathtracer": "https://cdn.jsdelivr.net/npm/three-gpu-pathtracer@0.0.23/build/index.module.js", "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.8/build/index.module.js" } }</script>
</head>
<body>
<p id="state">building…</p>
<img id="sheet">
<script>addEventListener("error", (e) => { window.RESULT ??= { ok: false, error: String(e.error?.stack || e.message) }; });</script>
<script type="module">
// Shots of a preset from given sides, in a row (for fitting a character to its design sheet: shoot, compare, change, shoot again).
// Run: node tools/shot.mjs subaru [--views 0,90,180] [--y 0,0.5] [--w 0.3] [--x 0] [--px 900] [--pose idle|aPose|walk…] [--t 0.5] [--quality fine] [--patch '{"outfit":{…}}'] [--name boots] [--lean 1]
//   lean: lines at the head's middle (red) and the ankles' (blue); the table gives the lean in mm (+ = forward; a stance stands upright near 0)
//   views: degrees round the figure (0 front, 90 her left side, 180 back, -90 her right), y: the heights shown (m), w: half the width shown (m),
//   x: the middle of the picture sideways in the view (m), patch: options merged over the preset's (to try a value without editing presets.js)
import * as THREE from "three";
import { createAvatar, CHARACTERS, figureStage } from "../src/index.js";

const Q = new URLSearchParams(location.search), name = Q.get("only") || "subaru", nums = (k, d) => (Q.get(k) ?? d).split(",").map(Number);
const merge = (a, b) => { for (const [k, v] of Object.entries(b)) a[k] = v && typeof v === "object" && !Array.isArray(v) && a[k] && typeof a[k] === "object" ? merge(a[k], v) : v; return a; };
try {
  const file = structuredClone(CHARACTERS[name].file); if (Q.get("patch")) merge(file.options, JSON.parse(Q.get("patch")));
  const av = await createAvatar(file, { quality: Q.get("quality") || "fine", cache: false });
  av.play(Q.get("pose") || "idle", { blend: 0 }); av.update(0, { instant: true, t: +(Q.get("t") || 0) });
  await new Promise((r) => setTimeout(r, 600));   // a face's pictures (data URLs) are decoded after the avatar is made
  const box = new THREE.Box3().setFromObject(av.object), [y0, y1] = Q.get("y") ? nums("y") : [box.min.y - 0.03, box.max.y + 0.03], H = +(Q.get("px") || 900);
  const half = (y1 - y0) / 2, cy = (y0 + y1) / 2, hw = +(Q.get("w") || half / 1.6), W = Math.round(H * hw / half), cx = +(Q.get("x") || 0);
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.setSize(W, H); renderer.outputColorSpace = THREE.SRGBColorSpace;
  const scene = new THREE.Scene(); scene.background = new THREE.Color("#f0ece4");
  scene.add(new THREE.HemisphereLight(0xffffff, 0xd8c8b8, 1.6)); const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(1.5, 3, 2.2); scene.add(sun);
  const FIG = av.options.shading.style === "figure"; let draw = (cam) => renderer.render(scene, cam);
  if (FIG) { renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap; await figureStage(renderer, scene);   // the figure look: the studio's light, shade in the creases (GTAO)
    scene.background = new THREE.Color(Q.get("bg") || "#a3a6ab");
    { // ⏳ a try: a glossy lens over each eye (a clear dome that only adds its reflections), placed by the face picture's eye position
      const F = av.internals.face, L = av.faceLayer, [rx, ry, rz] = nums("lens", "0.031,0.043,0.013"), hi = av.skeleton.bones.indexOf(av.bones.head), hold = new THREE.Group();
      hold.matrixAutoUpdate = false; hold.matrix.copy(av.skeleton.boneInverses[hi]); av.bones.head.add(hold);
      const uv = L.geometry.attributes.uv, P = L.geometry.attributes.position, N = L.geometry.attributes.normal, v0 = 1 - F.py(F.EYE.y) / F.faceCanvas.height;
      const mat = new THREE.MeshPhysicalMaterial({ color: 0x000000, roughness: 0.04, clearcoat: 1, clearcoatRoughness: 0.03, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, envMapIntensity: +(Q.get("lensEnv") ?? 4) });
      for (const sx of [1, -1]) { const u0 = F.px(sx * F.EYE.x) / F.faceCanvas.width; let b = 0, bd = 9;
        for (let i = 0; i < uv.count; i++) { const d = Math.hypot(uv.getX(i) - u0, uv.getY(i) - v0); if (d < bd) { bd = d; b = i; } }
        const m = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 28), mat), n = new THREE.Vector3().fromBufferAttribute(N, b).normalize(), p = new THREE.Vector3().fromBufferAttribute(P, b);
        m.scale.set(rx, ry, rz); m.position.copy(p).addScaledVector(n, +(Q.get("lensOut") ?? 0.002)); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), n); m.renderOrder = 3; m.userData.lens = true; hold.add(m); } }
    const floor = new THREE.Mesh(new THREE.CircleGeometry(3, 48), new THREE.ShadowMaterial({ opacity: 0.28 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
    const [{ EffectComposer }, { RenderPass }, { GTAOPass }, { OutputPass }] = await Promise.all(["EffectComposer", "RenderPass", "GTAOPass", "OutputPass"].map((n) => import(`three/addons/postprocessing/${n}.js`)));
    draw = (cam) => { const c = new EffectComposer(renderer), ao = new GTAOPass(scene, cam, W, H); ao.updateGtaoMaterial({ radius: 0.05, distanceExponent: 1.4, thickness: 1.2, scale: 1.25, samples: 16 }); ao.blendIntensity = +(Q.get("ao") ?? 1);
      c.addPass(new RenderPass(scene, cam)); c.addPass(ao); c.addPass(new OutputPass()); c.render(); }; }
  scene.add(av.object);
  // pt=<samples> (figure style): a still by path tracing (three-gpu-pathtracer), light bouncing between the surfaces. The posed figure is
  // baked to plain meshes with plain materials (the engine's shader additions don't carry over: gradients, shade normals)
  const PT = FIG ? +(Q.get("pt") || 0) : 0;
  if (PT) { const [{ WebGLPathTracer, GradientEquirectTexture }, { StaticGeometryGenerator }] = await Promise.all([import("three-gpu-pathtracer"), import("three-mesh-bvh")]);
    for (const k of ["backgroundRotation", "environmentRotation"]) THREE.Scene.prototype[k] ??= new THREE.Euler();   // (three 0.160 has neither; the tracer reads both)
    const pt = new WebGLPathTracer(renderer); pt.bounces = +(Q.get("bounces") || 5); pt.tiles.set(2, 2); pt.dynamicLowRes = false; pt.filterGlossyFactor = 0.5; pt.minSamples = 0; pt.fadeDuration = 0; pt.renderDelay = 0;
    const env = new GradientEquirectTexture(); env.topColor.set(0xffffff); env.bottomColor.set(0x9a9da2); env.update();
    const box = (w, h, at, power, c = 0xffffff) => { const m = new THREE.RectAreaLight(c, power, w, h); m.position.set(...at); m.lookAt(0, 0.7, 0); return m; };   // (a light the tracer aims at: far less noise than a glowing sheet)
    draw = async (cam) => { const stage = new THREE.Scene(); stage.background = scene.background; stage.environment = env; stage.environmentIntensity = +(Q.get("env") ?? 0.9); av.object.updateMatrixWorld(true);
      av.object.traverse((x) => { const s = x.material; let shown = true; x.traverseAncestors((p) => { shown &&= p.visible; }); if (!x.isMesh || x.userData.outline || !x.visible || !shown || !s || s.visible === false || s.colorWrite === false) return;
        const gen = new StaticGeometryGenerator(x); gen.attributes = ["position", "normal", "uv", "color"].filter((k) => x.geometry.attributes[k]); const geo = gen.generate();
        if (s.transparent && s.map && geo.attributes.normal) { const p = geo.attributes.position, n = geo.attributes.normal, LIFT = 0.0012 * (x.renderOrder || 1);   /* (each picture clear of the one under it too) */ for (let i = 0; i < p.count; i++) p.setXYZ(i, p.getX(i) + n.getX(i) * LIFT, p.getY(i) + n.getY(i) * LIFT, p.getZ(i) + n.getZ(i) * LIFT); }   // the pictures on the skin (face, brows): clear of it, or the rays take either at random
        const m = x.userData.lens ? new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.02, metalness: 1, transparent: true, opacity: +(Q.get("lensPt") ?? 0.1) })   // (a faint mirror: glass would keep the lights off the eye under it)
          : new THREE.MeshPhysicalMaterial({ color: s.color, map: s.map ?? null, roughness: s.roughness ?? 0.85, metalness: s.metalness ?? 0, vertexColors: !!s.vertexColors && !!geo.attributes.color, transparent: !!s.transparent && !s.map, alphaTest: s.transparent && s.map ? 0.5 : 0, opacity: s.opacity ?? 1,   /* (a picture is cut out: half-clear pixels leave the skin under them unlit, as dark specks) */ side: s.side,
            sheen: s.sheen ?? 0, sheenRoughness: s.sheenRoughness ?? 1, sheenColor: s.sheenColor ?? 0, clearcoat: s.clearcoat ?? 0, clearcoatRoughness: s.clearcoatRoughness ?? 0 });
        stage.add(new THREE.Mesh(geo, m)); });
      // the backdrop: a floor that sweeps up into a wall behind her (no horizon), turned to face the camera
      const cyc = new THREE.PlaneGeometry(40, 1, 1, 80), cp = cyc.attributes.position, RC = 2, Z0 = 8, ZB = -3;
      for (let i = 0; i < cp.count; i++) { const d = (0.5 - cp.getY(i)) * (Z0 - ZB + RC * Math.PI / 2 + 12), fl = Z0 - ZB, arc = RC * Math.PI / 2, t = Math.min(1, Math.max(0, (d - fl) / arc)) * Math.PI / 2;
        cp.setXYZ(i, cp.getX(i), d < fl ? 0 : RC - RC * Math.cos(t) + Math.max(0, d - fl - arc), d < fl ? Z0 - d : ZB - RC * Math.sin(t)); }
      cyc.computeVertexNormals(); const ground = new THREE.Mesh(cyc, new THREE.MeshStandardMaterial({ color: scene.background, roughness: 1, side: THREE.DoubleSide })); ground.rotation.y = Math.atan2(cam.position.x, cam.position.z); stage.add(ground);
      stage.add(box(2.2, 2.2, [-1.9, 3.0, 2.6], +(Q.get("key") ?? 9), 0xfff1e2), box(1.6, 2.4, [2.2, 2.0, -2.6], +(Q.get("rim") ?? 5), 0xdfe8ff), box(2.4, 2.4, [2.2, 1.1, 3], +(Q.get("fill") ?? 2.5))); stage.updateMatrixWorld(true);
      pt.setScene(stage, cam); const T = Date.now();
      while (pt.samples < PT) { pt.renderSample(); renderer.getContext().finish(); document.getElementById("state").textContent = "tracing " + pt.samples.toFixed(1) + "/" + PT + "  " + Math.round((Date.now() - T) / 1000) + " s"; await new Promise((r) => setTimeout(r, 0)); } }; }
  const views = nums("views", "0,90,180"), sheet = document.createElement("canvas"); sheet.width = W * views.length; sheet.height = H; const g = sheet.getContext("2d");
  for (const [i, deg] of views.entries()) { const a = deg * Math.PI / 180, PD = +(Q.get("persp") || 0), fv = 2 * Math.atan(half / (PD || 1)) * 180 / Math.PI, cam = PD ? new THREE.PerspectiveCamera(fv, W / H, 0.05, 40) : new THREE.OrthographicCamera(-hw, hw, half, -half, 0.01, 20), r = [Math.cos(a), 0, -Math.sin(a)], D = PD || 4, up = PD ? +(Q.get("up") || 0) : 0;   // persp=<distance, m>: a camera with perspective from there, up=<m> higher than what it looks at   // r: the picture's right
    cam.position.set(Math.sin(a) * D + r[0] * cx, cy + up, Math.cos(a) * D + r[2] * cx); cam.lookAt(r[0] * cx, cy, r[2] * cx); av.update(0, { camera: cam }); await draw(cam); g.drawImage(renderer.domElement, i * W, 0); }
  // lean (mm, + = forward): the head's middle against the ankles' middle, front to back (she faces +z). Upright reads about 0
  const P = (k, v = new THREE.Vector3()) => av.bones[k].getWorldPosition(v), hq = av.bones.head.getWorldQuaternion(new THREE.Quaternion());
  const headMid = P("head").add(new THREE.Vector3(0, (box.max.y - P("head").y) * 0.45, 0).applyQuaternion(hq)), ankles = P("foot.L").add(P("foot.R")).multiplyScalar(0.5);
  const lean = Math.round((headMid.z - ankles.z) * 1000);
  if (Q.get("lean")) views.forEach((deg, i) => { const a = deg * Math.PI / 180, r = [Math.cos(a), 0, -Math.sin(a)], X = (p) => i * W + W / 2 + (p.x * r[0] + p.z * r[2] - cx) / hw * W / 2, Y = (p) => H / 2 - (p.y - cy) / half * H / 2;
    g.lineWidth = 2; for (const [p, c] of [[headMid, "#e0306a"], [ankles, "#2a7de0"]]) { g.strokeStyle = c; g.beginPath(); g.moveTo(X(p), 0); g.lineTo(X(p), H); g.stroke(); g.fillStyle = c; g.beginPath(); g.arc(X(p), Y(p), 5, 0, 7); g.fill(); } });
  const png = sheet.toDataURL("image/png"); document.getElementById("sheet").src = png; document.getElementById("state").textContent = "done";
  window.RESULT = { ok: true, png, sheetName: Q.get("name") || name, table: `${name}: views ${views.join(", ")}  y ${y0.toFixed(3)}–${y1.toFixed(3)}  ${W}×${H} each  lean ${lean} mm`, box: { min: box.min.toArray(), max: box.max.toArray() } };
} catch (e) { document.getElementById("state").textContent = "error: " + e.message; window.RESULT = { ok: false, error: e.stack || e.message }; }
</script>
</body>
</html>
