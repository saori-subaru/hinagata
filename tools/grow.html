<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Hinagata — grow</title>
<style>body { margin: 0; background: #f0ece4; }</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/", "meshoptimizer": "https://cdn.jsdelivr.net/npm/meshoptimizer@1/index.js" } }</script>
</head>
<body>
<script type="module">
// 成長と動きのコマを作る: window.shot(g, time) が育ち g(0=ちび, 1=本人)・動き(?motion=dance)の time 秒の絵を PNG の dataURL で返す。tools/grow.mjs が回す。
// 数値の葉だけを線形に補間し、数値でない値(on/off・種類)は終点のもの(オン・オフは補間できず、そのコマで形がガクッと変わるため使わない)。
// ?stage=flowers: 舞台(tools/stage-flowers.js)の中で撮る。育ち・動きの時刻・カメラ・光は舞台が時刻から決める(shot(null, time))。
import * as THREE from "three";
import { createAvatar, CHARACTERS, BODY_TYPES } from "../src/index.js";
import { openRecipe, merge as mergeOpt, DEFAULTS } from "../src/options.js";

const Q = new URLSearchParams(location.search), who = Q.get("who") || "sylvie2", STAGE = Q.get("stage") ? await import(`./stage-${Q.get("stage")}.js`) : null;
const W = +(Q.get("w") || STAGE?.SIZE[0] || 540), H = +(Q.get("h") || STAGE?.SIZE[1] || 720);
// ?to=astel: 別の人へ変わる。両方を今の版の言葉に開いて既定値で埋める(版の違うファイルを混ぜないため。片方にしか無い数値も補間できる)。
// 数値と色は育ちに合わせて補間し、形の違う所(髪型・服・顔の絵・飾り)は育ち SW(?switch=0.5)のコマで丸ごと入れ替わる
const file = CHARACTERS[who].file, TO = Q.get("to"), SW = TO ? +(Q.get("switch") || 0.5) : null, open = (f) => structuredClone(mergeOpt(DEFAULTS, openRecipe(f).options));   // (clone: merge が DEFAULTS の枝を共有し、?set が既定値ごと書き換えた)
// ?like=sylvie2: ちびで始め、終わりは体の比率・太さ・頭の大きさだけその人に(ずんだもんがシルヴィの頭身まで育つ)
const LIKE = Q.get("like"), BODY = (o) => ({ body: { proportion: o.body.proportion, thickness: o.body.thickness, head: { scale: o.body.head.scale } } });
const end = TO ? open(CHARACTERS[TO].file) : LIKE ? mergeOpt(open(file), BODY(open(CHARACTERS[LIKE].file))) : structuredClone(file.options), from = TO || LIKE ? open(file) : null;
const setPath = (k, v) => { for (const root of from ? [end, from] : [end]) { const ks = k.split("."); let o = root; for (const p of ks.slice(0, -1)) o = o[p] ??= {}; o[ks.at(-1)] = structuredClone(v); } };
for (const [k, v] of Object.entries(STAGE?.SET ?? {})) setPath(k, v);
// ?set=outfit.cape.open=1.2;outfit.cape.hem=0.6 : 値を差し替えて試す(始点・終点とも)
for (const kv of (Q.get("set") || "").split(";").filter(Boolean)) { const [k, v] = kv.split("="); try { setPath(k, JSON.parse(v)); } catch { setPath(k, v); } }
// 始点: 本人の体を、同じ体型のちび(girl)の比率・太さ・頭の大きさに。arms はちびの null(胴と伸びる)を補間できないので 1
const chibi = structuredClone(BODY_TYPES[Q.get("from") || "girl"].body); chibi.proportion.arms = 1;
const merge = (a, b) => { const o = structuredClone(a); for (const [k, v] of Object.entries(b)) o[k] = v && typeof v === "object" && !Array.isArray(v) && o[k] && typeof o[k] === "object" ? merge(o[k], v) : v; return o; };
const start = LIKE ? merge(from, { body: { proportion: chibi.proportion, thickness: chibi.thickness, head: { scale: chibi.head.scale } } }) : from ?? merge(end, { body: { proportion: chibi.proportion, thickness: chibi.thickness, head: { scale: chibi.head.scale } } });
const hex = (v) => typeof v === "string" && /^#[0-9a-f]{6}$/i.test(v), mixHex = (a, b, t) => "#" + [1, 3, 5].map((i) => Math.round(parseInt(a.slice(i, i + 2), 16) * (1 - t) + parseInt(b.slice(i, i + 2), 16) * t).toString(16).padStart(2, "0")).join("");
const lerp = (a, b, t) => { if (typeof a === "number" && typeof b === "number") return a + (b - a) * t; if (hex(a) && hex(b)) return mixHex(a, b, t);
  if (a && b && typeof a === "object" && typeof b === "object" && !Array.isArray(a) && !Array.isArray(b)) { const o = {};
    for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) { if (k in a && k in b) o[k] = lerp(a[k], b[k], t); else if (SW == null || (k in a) === t < SW) o[k] = k in a ? a[k] : b[k]; } return o; }
  return SW == null || t >= SW ? b : a; };

// 顔の絵(face.images、アステルの目や口)は作った後に非同期で読まれ、読めたら顔を描き直す。待たずに撮ると顔が空になったので、読み終わるまで待つ
const loading = new Set(), NativeImage = window.Image;
window.Image = function (...a) { const im = new NativeImage(...a), done = () => loading.delete(im); loading.add(im); im.addEventListener("load", done); im.addEventListener("error", done); return im; };
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.setSize(W, H); renderer.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(30, W / H, 0.05, 50), S = STAGE?.createStage({ renderer, scene, cam, W, H });
if (!S) { scene.background = new THREE.Color("#f0ece4");
  scene.add(new THREE.HemisphereLight(0xffffff, 0xd8c8b8, 1.6)); const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(1.5, 3, 2.2); scene.add(sun); }
let av = null, frameH = null, curH = null, built = null, clock = null; const refs = {};
// 前向きのプリント(texture mode "front")は作ったときの位置にメートルで貼られ、体が伸びても付いてこない(ベルトが下へ滑って見えた)。
// texP(プリントを当てる位置)の高さを、ドレス(shirt と pants の部品)の裾から上端までで本人(最終形)のドレスに写す。横はそのまま
const texParts = (a) => ["shirt", "pants"].map((k) => a.parts[k]).filter((x) => x?.m?.visible && x.m.geometry?.attributes?.texP).map((x) => x.m.geometry.attributes.texP);
const span = (L) => { let lo = Infinity, hi = -Infinity; for (const A of L) for (let i = 1; i < A.array.length; i += 3) { lo = Math.min(lo, A.array[i]); hi = Math.max(hi, A.array[i]); } return [lo, hi]; };
// 瞬きは時刻で決める(作り直した体は自前の瞬きまで届かない)
const MOTION = Q.get("motion"), WARM = 0.6, blinkAt = S ? S.blink : (t) => t % 3.3 > 3.18;   // WARM: 作り直したコマでは髪と布が動きに追いつくよう、その前の 0.6 秒を回してから撮る
async function build(g) {
  if (built === g) return; if (av) { scene.remove(av.object); av.dispose?.(); }
  av = await createAvatar(from ? lerp(start, end, g) : { ...file, options: lerp(start, end, g) }, { quality: Q.get("q") || "game", cache: false, workers: false });
  while (loading.size) await new Promise((r) => setTimeout(r, 5));
  const L = texParts(av), [lo, hi] = span(L), ref = refs[SW != null && g < SW ? 0 : 1] ??= [lo, hi];   // (入れ替わりの前後で別の服: それぞれ最初に作った形に合わせる)
  if (hi > lo) for (const A of L) { for (let i = 1; i < A.array.length; i += 3) A.array[i] = ref[0] + (A.array[i] - lo) * (ref[1] - ref[0]) / (hi - lo); A.needsUpdate = true; }
  av.update(0, { instant: true }); scene.add(av.object); built = g; clock = null; window.AV = av;   // (AV: 調べもの用)
  { const b = new THREE.Box3().setFromObject(av.object); curH = b.max.y - b.min.y; frameH = Math.max(frameH ?? 0, curH); }   // 枠は一番大きな形(最初に作る終点か、最初のコマ)で固定し、背が伸びて見えるように
  if (MOTION) av.play(MOTION, { blend: 0 });
}
// g: 育ち(0 = ちび, 1 = 本人)、time: 動きの時刻(秒)
window.shot = async (g, time = 0, yaw = 0.35) => {
  if (g == null) g = S.grow(time);
  await build(g); av.object.rotation.y = S ? 0 : yaw;
  if (MOTION) { let tau = clock == null || time < clock ? time - WARM : clock; if (clock == null) av.update(0, { t: tau, instant: true, blink: blinkAt(tau) });
    while (tau < time - 1e-6) { const dt = Math.min(1 / 60, time - tau); tau += dt; av.update(dt, { t: S ? S.motion(tau) : tau, wind: S?.wind(tau), blink: blinkAt(tau) }); } clock = time; }
  else for (let i = 0; i < 3; i++) av.update(1 / 60, { instant: true });
  if (S) S.render(time, { av, H: curH, H1: frameH }); else { const cy = frameH * 0.5, d = frameH * 0.62 / Math.tan(THREE.MathUtils.degToRad(15));
    cam.position.set(0, cy, d); cam.lookAt(0, cy, 0); renderer.render(scene, cam); }
  return renderer.domElement.toDataURL("image/png");
};
window.frame = (g, yaw) => window.shot(g, 0, yaw);
window.STAGE = S && { seconds: S.seconds };
window.READY = true;
</script>
</body>
</html>
