<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Hinagata — a film shot of two</title>
<style>body { margin: 0; background: #000; } img { max-width: 100%; display: block; }</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/", "meshoptimizer": "https://cdn.jsdelivr.net/npm/meshoptimizer@1/index.js" } }</script>
</head>
<body>
<img id="sheet">
<script>addEventListener("error", (e) => { window.RESULT ??= { ok: false, error: String(e.error?.stack || e.message) }; });</script>
<script type="module">
// A cinematic still of two presets at dusk (backlit, rim light, fog, letterbox, grade). Run: node tools/scene.mjs [--a astel] [--b sylvie] [--shot wide|two|ots]
import * as THREE from "three";
import { createAvatar, CHARACTERS } from "../src/index.js";

const Q = new URLSearchParams(location.search), A = Q.get("a") || "astel", B = Q.get("b") || "sylvie", SHOT = Q.get("shot") || "two";
try {
  const make = async (id, face) => { const c = CHARACTERS[id], av = await createAvatar(structuredClone(c.file), { quality: "fine", cache: false });
    av.play(c.stand || "idle", { blend: 0 }); av.update(0, { instant: true, t: 0.8 }); if (face) av.setFace(face);
    av.setRim({ on: true, color: "#ffc58a", width: 0.35, strength: 1.4 }); return av; };
  const a = await make(A), b = await make(B);
  await new Promise((r) => setTimeout(r, 700));
  const W = 1920, H = 804;   // 2.39:1
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.setSize(W, H); renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
  const scene = new THREE.Scene();
  // sky: a dusk gradient on a big sphere (the sun low behind them)
  const sky = new THREE.Mesh(new THREE.SphereGeometry(60, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, uniforms: { sun: { value: new THREE.Vector3(0.25, 0.12, -1).normalize() } },
    vertexShader: "varying vec3 d; void main(){ d = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }",
    fragmentShader: `uniform vec3 sun; varying vec3 d; void main(){ float h = d.y; vec3 c = mix(vec3(1.0,0.55,0.28), vec3(0.16,0.2,0.42), smoothstep(-0.02,0.45,h));
      c = mix(c, vec3(0.35,0.22,0.3), smoothstep(0.0,-0.2,h)); float s = max(dot(d,sun),0.); c += vec3(1.,0.75,0.45)*pow(s,40.)*1.6 + vec3(1.,0.5,0.25)*pow(s,4.)*0.35; gl_FragColor = vec4(c,1.); }` }));
  scene.add(sky);
  scene.fog = new THREE.FogExp2(0x9a6a68, 0.035);
  // ground: grass-dark with a soft path
  const ground = new THREE.Mesh(new THREE.CircleGeometry(40, 64), new THREE.MeshStandardMaterial({ color: 0x2a3420, roughness: 1 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  // trees: dark silhouettes in the fog, ruins: a few broken pillars
  const rnd = ((s) => () => (s = (s * 16807) % 2147483647) / 2147483647)(7);
  const treeM = new THREE.MeshStandardMaterial({ color: 0x0c100c, roughness: 1 }), stoneM = new THREE.MeshStandardMaterial({ color: 0x8a8070, roughness: 0.9 });
  for (let i = 0; i < 55; i++) { const ang = rnd() * Math.PI * 2, r = 9 + rnd() * 22, x = Math.cos(ang) * r, z = Math.sin(ang) * r - 4; if (z > 2 && Math.abs(x) < 6) continue;
    const h = 4 + rnd() * 6, t = new THREE.Group(); const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.22, h * 0.5, 7), treeM); trunk.position.y = h * 0.25; t.add(trunk);
    for (let k = 0; k < 3; k++) { const c = new THREE.Mesh(new THREE.ConeGeometry(h * (0.22 - k * 0.05), h * 0.45, 9), treeM); c.position.y = h * (0.45 + k * 0.17); t.add(c); }
    t.position.set(x, 0, z); t.traverse((o) => { o.castShadow = true; }); scene.add(t); }
  for (const [x, z, h, tilt] of [[-3.2, -3.5, 2.6, 0], [-4.4, -2.2, 1.2, 0.1], [3.6, -4.2, 3.1, 0], [4.8, -3.0, 0.8, -0.2]]) {
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.32, h, 12), stoneM); p.position.set(x, h / 2, z); p.rotation.z = tilt; p.castShadow = p.receiveShadow = true; scene.add(p); }
  // light: low warm sun from behind (rim + long shadows toward the camera), cool sky fill, a soft key on the faces
  scene.add(new THREE.HemisphereLight(0x8fa6d8, 0x4a3a2a, 0.9));
  const sun = new THREE.DirectionalLight(0xffb070, 3.2); sun.position.set(-3, 4, -9); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 30 }); sun.shadow.bias = -0.0005; scene.add(sun);
  const key = new THREE.DirectionalLight(0xffe2c8, 1.1); key.position.set(3, 2.5, 5); scene.add(key);
  // blocking: he looks off toward the sun, she stands a step behind at his shoulder, turned to him
  a.object.position.set(-0.35, 0, 0.3); a.object.rotation.y = 0.55;
  b.object.position.set(0.45, 0, -0.35); b.object.rotation.y = -0.25;
  for (const av of [a, b]) { av.object.traverse((o) => { if (o.isMesh) o.castShadow = true; }); scene.add(av.object); }
  // motes: small glowing points drifting in the sun
  const mg = new THREE.BufferGeometry(), mp = []; for (let i = 0; i < 260; i++) mp.push((rnd() - 0.5) * 8, rnd() * 3.2, (rnd() - 0.6) * 6); mg.setAttribute("position", new THREE.Float32BufferAttribute(mp, 3));
  scene.add(new THREE.Points(mg, new THREE.PointsMaterial({ color: 0xffd9a0, size: 0.025, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false })));
  const cams = { two: [[1.6, 1.05, 3.2], [0.05, 1.05, -0.1], 30], wide: [[2.8, 0.6, 6.5], [0, 1.2, -1.5], 28], ots: [[-1.1, 1.25, 1.4], [0.45, 1.2, -0.35], 35] };
  const [cp, ct, fov] = cams[SHOT], cam = new THREE.PerspectiveCamera(fov, W / H, 0.05, 200); cam.position.set(...cp); cam.lookAt(...ct);
  for (const av of [a, b]) av.update(0, { camera: cam });
  renderer.render(scene, cam);
  // post (2D): bloom-ish glow from the bright parts, warm/teal grade, vignette, grain, letterbox already by aspect
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H; const g = cv.getContext("2d"); g.drawImage(renderer.domElement, 0, 0);
  const glow = document.createElement("canvas"); glow.width = W / 4; glow.height = H / 4; const gg = glow.getContext("2d"); gg.filter = "brightness(1.4) contrast(2.2) blur(6px)"; gg.drawImage(cv, 0, 0, W / 4, H / 4);
  g.globalCompositeOperation = "screen"; g.globalAlpha = 0.25; g.drawImage(glow, 0, 0, W, H); g.globalAlpha = 1;
  g.globalCompositeOperation = "soft-light"; const grad = g.createLinearGradient(0, 0, W, 0); grad.addColorStop(0, "#2a5a70"); grad.addColorStop(1, "#ffb070"); g.fillStyle = grad; g.globalAlpha = 0.35; g.fillRect(0, 0, W, H); g.globalAlpha = 1;
  g.globalCompositeOperation = "multiply"; const v = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.62); v.addColorStop(0, "#fff"); v.addColorStop(1, "#3a3040"); g.fillStyle = v; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = "source-over"; const id = g.getImageData(0, 0, W, H), d = id.data; for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - 0.5) * 10; d[i] += n; d[i + 1] += n; d[i + 2] += n; } g.putImageData(id, 0, 0);
  const out = document.createElement("canvas"); out.width = W; out.height = Math.round(W * 9 / 16); const o = out.getContext("2d"); o.fillStyle = "#000"; o.fillRect(0, 0, out.width, out.height); o.drawImage(cv, 0, (out.height - H) / 2);
  const png = out.toDataURL("image/png"); document.getElementById("sheet").src = png;
  window.RESULT = { ok: true, png, sheetName: Q.get("name") || `scene-${SHOT}`, table: `${A} + ${B}: ${SHOT}` };
} catch (e) { window.RESULT = { ok: false, error: e.stack || e.message }; }
</script>
</body>
</html>
